[pytest]
# test_slicegpt.py stays at the repo root: it calls hydra's initialize(), which resolves
# config_path relative to the calling file, so moving it under tests/ would break it.
testpaths = tests test_slicegpt.py
addopts = -q
markers =
    gpu: requires a CUDA device
    slow: takes more than a few seconds
    network: needs to reach the HuggingFace hub (and a token for gated repos)
