[workspace]
authors = ["Janek <jan.malasnicki@gmail.com>"]
channels = ["conda-forge"]
name = "nano"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]   # drop osx-64 (Intel Mac)
version = "0.1.0"

# Refuse to run rather than silently rewrite the lock. Measured, not guessed:
# pixi 0.63.2 writes lock v6, 0.67.1 leaves it at v6, but 0.77.0 and 0.81.0 both bump it
# to v7 -- and helios's pixi 0.67.1 cannot read v7, so a single `pixi run` on a modern
# pixi used to break the clusters by rewriting +6234/-6089 lines of lock nobody asked it
# to touch. With this bound a too-new pixi stops with a clear message instead.
#
# lem runs 0.63.2 and helios 0.67.1, so both stay inside it. The clusters activate their
# environment from their own PIXI_HOME, which has its own manifest, so this bound applies
# only to pixi commands run inside the repo -- which is exactly where the damage happened.
# To use a newer pixi for running code, bypass pixi: ./.pixi/envs/default/bin/python ...
requires-pixi = ">=0.60,<0.77"

[tasks]
install_hooks = "git config --local core.hooksPath .githooks"

[dependencies]
python = "==3.12.3"

[pypi-dependencies]
transformers = "==4.56.2"
datasets = "==3.1.0"
submitit = "==1.5.2"
hydra-core = "==1.3.2"
hydra-submitit-launcher = "==1.2.0"
fabric = "==3.2.2"
pydantic = "==2.10.4"
torchdata = "==0.11.0"
black = "==25.1.0"
pytest = ">=8.0,<9"
torchao = "==0.11.0"
torchtune = "==0.6.1"
lm-eval = ">=0.4.0"
accelerate = ">=0.26.0"
jupyter = "*"
ipykernel = "*"
matplotlib = "*"
wandb = ">=0.23.1, <0.24"

[target.linux-64.pypi-dependencies]
torch = { version = "==2.7.1", index = "https://download.pytorch.org/whl/cu128" }

[target.linux-aarch64.pypi-dependencies]
torch = { version = "==2.6", index = "https://download.pytorch.org/whl/cu126"}

# macOS (Apple Silicon): CPU wheels (PyPI has arm64 wheels)
[target.osx-arm64.pypi-dependencies]
torch = "==2.6.0"
