[workspace]
authors = ["Janek <jan.malasnicki@gmail.com>"]
channels = ["conda-forge"]
name = "nano"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]   # drop osx-64 (Intel Mac)
version = "0.1.0"

# No requires-pixi any more. It existed because lem ran pixi 0.63.2 and helios 0.67.x,
# neither of which can read a v7 lock: a `pixi run` on a modern pixi rewrote pixi.lock
# to v7 and the cluster then silently re-solved the environment. Both are on 0.83.0 as
# of 2026-10-29, and entropy's 0.77.0 reads and writes v7 too, so no cluster is left
# that the format can break -- and a bound that refuses every modern pixi, including
# `pixi run install_hooks`, costs more than it now buys.
#
# What replaces it is narrower and aimed at the real damage: pixi.lock is pinned to a
# declared version by .githooks/pre-commit and by test_pixi_lock_stays_at_the_pinned_version.
# The danger was never the format number, it was the *re-solve* that comes with the
# rewrite -- +6234/-6089 lines, pinned versions gone, nothing saying so. Moving the lock
# to v7 is a deliberate change: bump PINNED_LOCK_VERSION, regenerate, and verify the
# environment on each cluster before merging.

[tasks]
# Kept for habit, but it cannot run on a pixi that requires-pixi excludes -- which is
# every pixi that would rewrite the lock, i.e. exactly the ones the hook protects
# against. Run scripts/install_hooks.sh directly instead; it needs no pixi.
install_hooks = "bash scripts/install_hooks.sh"

[dependencies]
python = "==3.12.3"

[pypi-dependencies]
transformers = "==4.56.2"
datasets = "==3.1.0"
submitit = "==1.5.2"
hydra-core = "==1.3.2"
hydra-submitit-launcher = "==1.2.0"
fabric = "==3.2.2"
pydantic = "==2.10.4"
torchdata = "==0.11.0"
black = "==25.1.0"
pytest = ">=8.0,<9"
torchao = "==0.11.0"
torchtune = "==0.6.1"
lm-eval = ">=0.4.0"
accelerate = ">=0.26.0"
jupyter = "*"
ipykernel = "*"
matplotlib = "*"
wandb = ">=0.23.1, <0.24"

[target.linux-64.pypi-dependencies]
torch = { version = "==2.7.1", index = "https://download.pytorch.org/whl/cu128" }

[target.linux-aarch64.pypi-dependencies]
torch = { version = "==2.6", index = "https://download.pytorch.org/whl/cu126"}

# macOS (Apple Silicon): CPU wheels (PyPI has arm64 wheels)
[target.osx-arm64.pypi-dependencies]
torch = "==2.6.0"
