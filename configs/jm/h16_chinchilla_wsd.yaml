# h16_chinchilla with WSD instead of cosine: wsd.yaml's warmup 300 / decay 3_000 (1% / 10% of n_steps).
defaults:
  - h16_chinchilla
  - override ../_trainer/_scheduler@trainer.scheduler: wsd
  - _self_

infrastructure:
  metric_logger:
    name: h16_chinchilla_wsd
    tags:
      - nano
      - remote
      - h16
      - chinchilla
      - wsd
