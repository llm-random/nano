# 2-node lem smoke test of the packed pixi env (documents/notes/lem_packed_pixi_env.md): each node
# unpacks its own copy, then torchrun trains across both, 1 GPU per node. Not an experiment.
defaults:
  - /base_schema
  - ../../_cluster@_here_: lem
  - ../../_model/h_balanced@_here_: h4
  - ../../_trainer@_here_: nano
  - ../../_dataset@_here_: fineweb
  - ../../_checkpoints@_here_: none
  - ../../_misc@_here_: default
  - ../../_downstream_eval@_here_: joint
  - _self_

common:
  sequence_length: 1024
  batch_size: 64

trainer:
  # micro 32 x 1024 per GPU
  gradient_accumulation_steps: 1
  n_steps: 200
  learning_rate: 9

  checkpoint:
    save:
      type: nano
      # scratch dir, apart from the real runs' checkpoints/
      path: ${oc.env:PROJECT_HOME_PATH,/lustre/pd03/plgrid/plgllmefficont3/nano/pretraining}/${oc.env:USER}/checkpoints_test
      interval: 100

downstream_evaluator:
  # small limit: checks the in-loop eval runs, not its scores
  limit: 20
  eval_interval: 100

infrastructure:
  metric_logger:
    name: h4_lem_packed_env_2node
    # no lr_tune/chinchilla tags: lr_plots and collect_checkpoints select runs by tag
    tags:
      - nano
      - h4
      - remote_test
      - packed_env
      - multinode

  slurm:
    time: "00:30:00"
    nodes: 2
    # multi-node jobs get Lustre TMPDIR by default; the env needs local disk on every node
    gres: "gpu:hopper:1,storage:local:40G"
    job-name: ${infrastructure.metric_logger.name}
