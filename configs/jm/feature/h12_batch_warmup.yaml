# h12_chinchilla with a longer batch size warmup: 800 steps at batch 64, 800 at 128, then 256; same 3.15B tokens.
defaults:
  - ../h12_chinchilla@_global_
  - _self_

common:
  batch_size: ${trainer.batch_size_warmup.final_batch_size}

trainer:
  # micro 64 per GPU at the final 256; h12_chinchilla's 1 (batch 64) would give 128, likely OOM
  gradient_accumulation_steps: 2
  # 12_000 full batches of tokens: the 1_600 warmup steps cover 600 of them.
  n_steps: 13_000
  batch_size_warmup:
    batch_sizes: [64, 128]
    steps: [800, 800]
    final_batch_size: 256
  scheduler:
    # h12_chinchilla's values before its ramp, pinned: 1%/10% of the longer n_steps would shift them.
    warmup_steps: 120
    decay_steps: 1_200

infrastructure:
  metric_logger:
    name: h12_batch_warmup
    tags:
      - nano
      - h12
      - lr_tune
      - chinchilla
      - wsd
      - batch_warmup
      - qk_norm
