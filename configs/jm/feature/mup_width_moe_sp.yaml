# MoE width sweep, SP arm (adamw_groups): mup_width_sp with the MoE feed-forward (8 experts, top-2); 25 runs.
defaults:
  # no /base_schema: `^` sweep keys under trainer are rejected by it (see src/definitions.py)
  - ../../_cluster@_here_: lem
  - ../../_model/h_balanced@_here_: h12
  - ../../_ff_layer@model.encoder.block_fn.ff_layer_fn: moe
  - ../../_trainer@_here_: nano
  - ../../_dataset@_here_: fineweb
  - ../../_checkpoints@_here_: none
  - ../../_misc@_here_: default
  - override ../../_trainer/_optimizer@optimizer: adamw_groups
  - _self_

# One grid point per (h, lr): 5 LR exponents around the dense SP optimum at each width (5, 6, 7, 8, 9).
^sweep:
  - h: 2
    ^lr: [3, 4, 5, 6, 7]
  - h: 4
    ^lr: [4, 5, 6, 7, 8]
  - h: 8
    ^lr: [5, 6, 7, 8, 9]
  - h: 12
    ^lr: [6, 7, 8, 9, 10]
  - h: 16
    ^lr: [7, 8, 9, 10, 11]

common:
  h: ${sweep.h}
  n_blocks: 4
  sequence_length: 1024
  batch_size: 64

trainer:
  # micro 64 x 1024 on 1 GPU
  gradient_accumulation_steps: 1
  # 131M tokens, as the dense sweep; costs and results in plan/lines/line2_optimizer.md (task 2)
  n_steps: 2_000
  learning_rate: ${sweep.lr}
  scheduler:
    warmup_steps: 100
    decay_steps: 400

infrastructure:
  metric_logger:
    name: mup_width_moe_sp
    tags:
      - nano
      - mup_width_sweep
      - moe
      - sp
      - wsd
      - qk_norm
      - bs64

  slurm:
    time: "01:00:00"
    gres: gpu:hopper:1
    job-name: ${infrastructure.metric_logger.name}
