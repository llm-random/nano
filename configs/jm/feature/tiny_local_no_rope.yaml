# tiny_local with NoPE on every 4th layer (layer 3 of 4). Run: pixi run python main.py --config-path configs/jm/feature --config-name tiny_local_no_rope
defaults:
  - ../../tiny_local@_global_
  - _self_

common:
  attention:
    no_rope_layers: every_4th

infrastructure:
  metric_logger:
    type: stdout
