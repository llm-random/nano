# muP width sweep, muP arm (adamw_mup, base width h4) at h16: LR grid at depth 4, short WSD runs on 1 GPU.
defaults:
  # no /base_schema: `^` sweep keys under trainer are rejected by it (see src/definitions.py)
  - ../../_cluster@_here_: lem
  - ../../_model/h_balanced@_here_: h16
  - ../../_trainer@_here_: nano
  - ../../_dataset@_here_: fineweb
  - ../../_checkpoints@_here_: none
  - ../../_misc@_here_: default
  - override ../../_trainer/_optimizer@optimizer: adamw_mup
  - _self_

common:
  n_blocks: 4
  sequence_length: 1024
  batch_size: 64

trainer:
  # micro 64 x 1024 on 1 GPU
  gradient_accumulation_steps: 1
  # 131M tokens; costs per width in plan/lines/line2_optimizer.md (task 2)
  n_steps: 2_000
  ^learning_rate: [4, 5, 6, 7, 8]
  scheduler:
    warmup_steps: 100
    decay_steps: 400

infrastructure:
  metric_logger:
    name: mup_width_mup_h16
    tags:
      - nano
      - mup_width_sweep
      - mup
      - h16
      - wsd
      - qk_norm
      - bs64

  slurm:
    time: "01:00:00"
    gres: gpu:hopper:1
    job-name: ${infrastructure.metric_logger.name}
