# MFU batch size ladder, h20 at seq 1024: 128 steps at each batch 4..128; no checkpoints, evals or heavy metrics.
defaults:
  - /base_schema
  - ../../_cluster@_here_: lem
  - ../../_model/h_balanced@_here_: h20
  - ../../_trainer@_here_: nano
  - ../../_dataset@_here_: fineweb
  - ../../_checkpoints@_here_: none
  - ../../_misc@_here_: default
  - _self_

common:
  sequence_length: 1024
  batch_size: 128

trainer:
  # micro 32 x 1024 per GPU at batch 128, ~55 GiB (h16's per-token memory x 400/256); 256 would need ~100 GiB
  gradient_accumulation_steps: 1
  n_steps: 768
  learning_rate: 10
  batch_size_warmup:
    batch_sizes: [4, 8, 16, 32, 64]
    # 128, not 100: a stage must end on a loader batch (128 / 4 = 32 steps)
    steps: [128, 128, 128, 128, 128]
    final_batch_size: ${common.batch_size}
  eval_interval: 0
  eval_dataloader: null

infrastructure:
  metric_logger:
    name: h20_sl1024_mfu_bs
    heavy_metrics_calculation_interval: 0
    tags:
      - nano
      - h20
      - qk_norm
      - jm_mfu_benchmarking
      - mfu_bs_ladder

  slurm:
    time: "01:00:00"
    gres: gpu:hopper:4
    job-name: ${infrastructure.metric_logger.name}
