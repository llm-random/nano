# MFU batch size ladder, h12 at seq 1024: 128 steps at each batch 4..256; no checkpoints, evals or heavy metrics.
defaults:
  - /base_schema
  - ../../_cluster@_here_: lem
  - ../../_model/h_balanced@_here_: h12
  - ../../_trainer@_here_: nano
  - ../../_dataset@_here_: fineweb
  - ../../_checkpoints@_here_: none
  - ../../_misc@_here_: default
  - _self_

common:
  sequence_length: 1024
  batch_size: 256

trainer:
  # micro 128 x 1024 per GPU at batch 256: 80.5 GiB peak, ~99% of a lem H100
  gradient_accumulation_steps: 1
  n_steps: 896
  learning_rate: 10
  batch_size_warmup:
    batch_sizes: [4, 8, 16, 32, 64, 128]
    # 128, not 100: a stage must end on a loader batch (256 / 4 = 64 steps)
    steps: [128, 128, 128, 128, 128, 128]
    final_batch_size: ${common.batch_size}
  eval_interval: 0
  eval_dataloader: null

infrastructure:
  metric_logger:
    name: h12_sl1024_mfu_bs
    heavy_metrics_calculation_interval: 0
    tags:
      - nano
      - h12
      - qk_norm
      - jm_mfu_benchmarking
      - mfu_bs_ladder

  slurm:
    time: "01:00:00"
    gres: gpu:hopper:2
    job-name: ${infrastructure.metric_logger.name}
