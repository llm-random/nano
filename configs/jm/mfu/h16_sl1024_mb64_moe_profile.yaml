# MoE step profile, h16 at seq 1024, micro 64: 300 steps at batch 256, kernel profile at steps 12-13; pairs with h16_sl1024_mb64_dense_profile.
defaults:
  - /base_schema
  - ../../_cluster@_here_: lem
  - ../../_model/h_balanced@_here_: h16
  - ../../_trainer@_here_: nano
  - ../../_dataset@_here_: fineweb
  - ../../_checkpoints@_here_: none
  - ../../_misc@_here_: default
  - ../../_ff_layer@model.encoder.block_fn.ff_layer_fn: moe
  - _self_

common:
  sequence_length: 1024
  batch_size: 256

trainer:
  # micro 64 x 1024 per GPU: ~70 GiB, twice the activations of micro 32's 37.1 GiB peak
  gradient_accumulation_steps: 1
  n_steps: 300
  learning_rate: 10
  kernel_profile: true
  profile_timers: true
  eval_interval: 0
  eval_dataloader: null

infrastructure:
  metric_logger:
    name: h16_sl1024_mb64_moe_profile
    heavy_metrics_calculation_interval: 0
    tags:
      - nano
      - h16
      - qk_norm
      - jm_mfu_benchmarking
      - moe_profile
      - torch211
      - mb64
      - moe

  slurm:
    time: "00:30:00"
    gres: gpu:hopper:4
    job-name: ${infrastructure.metric_logger.name}
