# Eval-only: scores h16_chinchilla's final checkpoint (final_ce + the nine benchmarks).
# Source: W&B 94vzm552 (slurm 32931), final_ce 2.677734375; this run's final_ce must match.
defaults:
  - h16_chinchilla
  - ../_downstream_eval@_here_: joint
  - _self_

eval_only: true

trainer:
  checkpoint:
    load:
      # <save.path>/<slurm job id>/<array task id>/step_29999
      path: /storage_nvme_4/nano/pretraining/j321m/checkpoints/32931/0/step_29999
      training_state_filename: __training_state_filename.pt

infrastructure:
  metric_logger:
    name: h16_chinchilla_eval
    tags:
      - nano
      - remote
      - h16
      - chinchilla
      - branch_compare
      - eval_only
      - h16_chinchilla
  slurm:
    time: "01:00:00"
    # Same world size as training: no DCP resharding on load.
    gres: gpu:4
