defaults:
  # no /base_schema: `^` sweep keys under trainer are rejected by it (see src/definitions.py)
  - ../_cluster@_here_: lem
  - ../_model/h_balanced@_here_: h12
  # WSD: warmup 2_000, stable, linear decay to 0 over the last 10% of n_steps
  - ../_trainer@_here_: nano
  - ../_dataset@_here_: fineweb
  - ../_checkpoints@_here_: none
  - ../_misc@_here_: default
  - ../_downstream_eval@_here_: joint
  - _self_

common:
  sequence_length: 1024
  batch_size: 64

trainer:
  # micro 32 x 1024 per GPU (batch 64 over 2 GPUs)
  gradient_accumulation_steps: 1
  # 3.28B tokens, 26.5 per active param; the batch-256 ramp runs had 3.51B (53_600 steps here)
  n_steps: 50_000
  ^learning_rate: [8, 9, 10, 11, 12]
  scheduler:
    warmup_steps: 2_000
    # = checkpoint interval, so the last stable step is saved; keep n_steps a multiple of 10
    decay_steps: ${eval:'${trainer.n_steps} // 10'}

  checkpoint:
    save:
      type: nano
      # job uses the cluster's PROJECT_HOME_PATH; the fallback only satisfies run_exp.py's laptop-side check
      path: ${oc.env:PROJECT_HOME_PATH,/storage_nvme_4/nano/pretraining}/${oc.env:USER}/checkpoints
      # 10 saves (step_4999 .. step_49999 at 50_000); the 9th is the last stable step, to branch a decay from
      interval: ${trainer.scheduler.decay_steps}

downstream_evaluator:
  # Same grid as checkpoints; the last step is scored after the final save.
  eval_interval: ${trainer.checkpoint.save.interval}

infrastructure:
  max_concurrent_jobs: -1

  metric_logger:
    name: h12_chinchilla
    tags:
      - nano
      - h12
      - lr_tune
      - chinchilla
      - wsd
      - qk_norm
      - bs64

  slurm:
    time: "04:00:00"
    gres: gpu:hopper:2
    job-name: ${infrastructure.metric_logger.name}
