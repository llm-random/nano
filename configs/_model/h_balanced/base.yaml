# H-balanced transformer: every dimension derives from the one integer knob
# `common.h` (see documents/concepts/h-balanced-model.md). H must be even.
#
#   n_blocks = H, q_heads = H, kv_heads = H/2 (GQA, always),
#   dmodel = 64*H, dff = 4*dmodel = 256*H, head_dim = 64 by construction.
#
# `common` is an interpolation namespace, not an instantiated object: nothing
# reads it but the ${...} references below and in the trainer/dataset configs.
common:
  h: ???
  dhead: 64
  dmodel: ${eval:'64 * ${common.h}'}
  dff: ${eval:'256 * ${common.h}'}
  n_blocks: ${common.h}
  q_heads: ${common.h}
  kv_heads: ${eval:'${common.h} // 2'}
  # GPT-NeoX tokenizer: len 50277 (max id 50276), padded to a multiple of 128.
  # The concept doc said 50257, which is GPT-2's count -- measured 2026-10-30.
  vocab_size: 50304
  sequence_length: ???
  # Which attention each layer runs (src/core/attention.py). "type" names the
  # registered type used everywhere; per-layer mixing arrives with the pattern
  # work in stage 2 phase E.
  attention:
    type: gqa


model:
  _target_: src.core.model.LLM

  embedding:
    _target_: src.core.model.TransformerEmbedding
    vocab_size: ${common.vocab_size}
    dmodel: ${common.dmodel}
    init_fn:
      _target_: src.core.model.trunc_normal_
      _partial_: true

  encoder:
    _target_: src.core.model.TransformerEncoder
    n_blocks: ${common.n_blocks}
    block_fn:
      _target_: src.core.model.TransformerBlock
      _partial_: true
      norm_fn:
        _target_: src.core.model.RMSNorm
        _partial_: true
        eps: 1e-5
        normalized_shape: ${common.dmodel}

      attention_fn:
        _target_: src.core.attention.build_attention
        _partial_: true
        attention: ${common.attention}
        n_blocks: ${common.n_blocks}
        dmodel: ${common.dmodel}
        q_heads: ${common.q_heads}
        kv_heads: ${common.kv_heads}
        seq_len: ${common.sequence_length}
        # llm-random lineage: base 10000, no llama frequency scaling.
        rope_base: 10000
        rope_scale_freqs: false
        init_scale: 1

      ff_layer_fn:
        _target_: src.core.model.GatedFeedForward
        _partial_: true
        ff_pre_act_fn:
          _target_: src.core.model.Linear
          _partial_: true
          in_features: ${common.dmodel}
          out_features: ${common.dff}
          partial_init_fn:
            _target_: src.core.model.llm_random_weight_init
            _partial_: true
            scale: 1
        ff_post_act_fn:
          _target_: src.core.model.Linear
          _partial_: true
          in_features: ${common.dff}
          out_features: ${common.dmodel}
          partial_init_fn:
            _target_: src.core.model.llm_random_weight_init
            _partial_: true
            scale: 1
        gate_fn: ${model.encoder.block_fn.ff_layer_fn.ff_pre_act_fn}

  head:
    _target_: src.core.model.TransformerHead
    linear_fn:
      _target_: src.core.model.Linear
      _partial_: true
      in_features: ${common.dmodel}
      out_features: ${common.vocab_size}
      partial_init_fn:
        _target_: src.core.model.llm_random_weight_init
        _partial_: true
        scale: 1
    norm_fn:
      _target_: src.core.model.RMSNorm
      _partial_: true
      eps: 1e-5
      normalized_shape: ${common.dmodel}
