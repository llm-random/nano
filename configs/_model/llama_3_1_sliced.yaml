# SliceGPT-sliced nano Llama (see src/projected_compression/slicegpt, slicegpt.md):
# residual width common.dmodel = sliced d; attention inner width common.datt stays at the base value;
# FFN width common.dff (HP-pruned for the hybrid); every residual carries a trainable d x d shortcut_Q.
defaults:
  - llama_3_1
  - _self_

model:
  encoder:
    block_fn:
      shortcut_dim: ${common.dmodel}
