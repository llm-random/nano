# simpleP for AdamW: muP's LR rule only (documents/notes/simplep_over_mup.md); init and decay as adamw_groups.
# m = common.dmodel / base_dmodel: hidden and head LR / m.
base_dmodel: 256
roles:
  vector:
    lr_multiplier: 1
    weight_decay: 0.0
  embedding:
    lr_multiplier: 1
    weight_decay: 0.0
  head:
    lr_multiplier: ${eval:'${optimizer.base_dmodel} / ${common.dmodel}'}
    weight_decay: ${trainer.weight_decay}
  hidden:
    lr_multiplier: ${eval:'${optimizer.base_dmodel} / ${common.dmodel}'}
    weight_decay: ${trainer.weight_decay}
