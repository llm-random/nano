
trainer:
  _partial_: true
  _target_: src.core.trainer.Trainer
  eval_interval: 100
  n_eval_steps: 10
  gradient_accumulation_steps: 1
  gradient_clipping: 1.0
  n_steps: null
  # Or the length in BILLIONS of tokens (leave n_steps null): becomes
  # ceil(n_tokens_b * 1e9 / (common.batch_size * (common.sequence_length - 1)))
  # steps -- the tokens the model trains on, rounded up, like the hand-written
  # counts (8B at 512 rows of 2049: 7630 steps).
  n_tokens_b: null
  learning_rate: null
  # AME memory banks (q_bank/k_bank) train at this multiple of learning_rate,
  # for the whole schedule. Ignored by a model without banks. AME runs and
  # checkpoints from before 4.0 became the default (standard_models,
  # 2026-11-21) trained at 1.0: set bank_lr_ratio: 1 to resume one. An exact
  # rerun also needs the code it ran with: since 2026-11-25 each part of the
  # model initializes from its own seed (src/core/init_rng.py). A full resume of an old checkpoint at 4.0 fails on the ordinary path
  # (the optimizer has one more param group), but under memory parallelism it
  # resumes at 4x with no error. A weights-only load (checkpoint.load.
  # only_weights) works at any ratio: it reads only the weights.
  bank_lr_ratio: 4.0
  weight_decay: 0.1

  scheduler:
    _partial_: true
    _target_: src.core.schedulers.get_cosine_scheduler_with_warmup
    final_lr_fraction: 0.1
    warmup_steps: ${eval:'int(${trainer.n_steps} * 0.01)'}

  distributed:
    fsdp2:
      modules_to_shard: 
        - ${model.embedding._target_}
        - ${model.encoder.block_fn._target_}
        - ${model.head._target_}
  
  train_dataloader:
    dataset:
      tokenize_fn:
        _target_: src.core.datasets.gpt_neox_tokenize_fn
      

  eval_dataloader:
    dataset:
      tokenize_fn:
        _target_: src.core.datasets.gpt_neox_tokenize_fn
