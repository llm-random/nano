# @package _global_
# Mini smoke test for the critical_batch_size grid on entropy.
# 2 x 2 = 4 jobs, ~200 steps each, tiny model.
defaults:
  - /_cluster@_here_:                entropy
  - /_model/context_scaling@_here_:  template
  - /_trainer@_here_:                context_scaling
  - /_dataset@_here_:                fineweb
  - /_checkpoints/context_scaling@_here_: shared_entropy
  - /_infrastructure@_here_:         default

  - /_feedforward:                   dense
  - /_attention:                     mha
  - /_parameterization:              standard
  - _self_

common:
  n_blocks: 4
  ^batch_size: [8, 16]
  sequence_length: 512
  data_seed: 301

trainer:
  n_steps: 201
  ^learning_rate: [8, 10]
  eval_interval: 100
  scheduler:
    warmup_steps: 50

infrastructure:
  metric_logger:
    heavy_metrics_calculation_interval: 100
    name: critical_batch_size_mini
    tags:
      - nano
      - critical_batch_size
      - mini_smoke
      - bs${common.batch_size}
      - lr${trainer.learning_rate}
      - ${now:%Y-%m-%d}

  slurm:
    time: "00:30:00"
    gres: gpu:1
    job-name: ${infrastructure.metric_logger.name}
