# Exercises the fineweb holdout and the eval world-size setting on real cluster data.
#
# fineweb shipped only a train directory, so eval scored the training data; the fix
# carves a disjoint slice out of that one directory (_dataset/fineweb.yaml sets
# holdout: train / holdout: eval). The unit tests prove the slices are disjoint on the
# tiny local dataset, but the real fineweb is a very large Arrow dataset and the split
# runs through len() and .select() before to_iterable_dataset -- which is a different
# thing entirely at that size. This config runs both branches against it.
#
# Unlike the other smoketests it leaves eval ON, because the eval dataloader is half of
# what is being tested.
defaults:
  - ../_cluster@_here_: helios
  - ../_model@_here_: llama_tiny_compressor
  - ../_trainer@_here_: llama
  - ../_dataset@_here_: fineweb
  - ../_checkpoints@_here_: none
  - ../_misc@_here_: default

common:
  sequence_length: 1024
  batch_size: 16

trainer:
  gradient_accumulation_steps: 1
  n_steps: 12
  learning_rate: 1e-3
  scheduler:
    warmup_steps: 1
  eval_interval: 4
  n_eval_steps: 2

apply_functions:
  - _target_: src.projected_compression.compression.init_compression
    _partial_: true
    dimensions_importances_path: /net/storage/pr3/plgrid/plggllmeffi3/pc/plgmstefaniak/pc_assets/tiny_random_dimensions_importances.pt
    target_dmodel: ${common.dmodel}
    target_dff: ${common.dff}

infrastructure:
  metric_logger:
    name: smoketest_helios_fineweb_holdout
    new_wandb_job: true
    wandb_entity: ideas_cv
    project_name: llm-random-test
    tags:
      - smoketest
      - fineweb
      - holdout
      - helios

  slurm:
    job-name: ${infrastructure.metric_logger.name}
    gres: "gpu:1"
    time: "0-00:40:00"
    account: plgllmefficont3-gpu-gh200
