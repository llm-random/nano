# 1-GPU PC smoketest for the HELIOS cluster (plgrid-gpu-gh200).
# Self-contained: tiny projected-compression Llama (random init, no source
# checkpoint and no importances file -- helios has none of the 1B PC assets).
# Purpose: prove the pixi env, dataset path, PC model build, init_compression
# and the training loop still work end-to-end on helios.
defaults:
  - ../_cluster@_here_: helios
  - ../_model@_here_: llama_tiny_compressor
  - ../_trainer@_here_: llama
  - ../_dataset@_here_: fineweb
  - ../_checkpoints@_here_: none
  - ../_misc@_here_: default

common:
  sequence_length: 1024
  batch_size: 16

trainer:
  gradient_accumulation_steps: 2
  n_steps: 20
  learning_rate: 1e-3
  scheduler:
    warmup_steps: 2
  eval_dataloader: None
  eval_interval: 0

# llama_tiny_compressor has no real importances file; init_compression requires one.
# This is a seeded random vector set matching base_dmodel=512 / base_dff=2048 / 4 blocks,
# i.e. the same shape family as the "random" importances variant used in the ablations.
apply_functions:
  - _target_: src.projected_compression.compression.init_compression
    _partial_: true
    dimensions_importances_path: /net/storage/pr3/plgrid/plggllmeffi3/pc/plgmstefaniak/pc_assets/tiny_random_dimensions_importances.pt
    target_dmodel: ${common.dmodel}
    target_dff: ${common.dff}

infrastructure:
  metric_logger:
    name: smoketest_helios_pc_tiny_1gpu
    new_wandb_job: true
    wandb_entity: ideas_cv
    project_name: llm-random-test
    tags:
      - smoketest
      - pc
      - tiny_llama
      - 1gpu
      - helios

  slurm:
    job-name: ${infrastructure.metric_logger.name}
    gres: "gpu:1"
    time: "0-02:00:00"
    account: plgllmefficont3-gpu-gh200
