# no-P ablation: PCD @ 90% with P1/P2 FROZEN everywhere -> trains only W_b (W_aux)+norms.
# LR matched to HPD Table 2(b) at 90% (lr=12).
# Entropy variant: user j321m, entropy cluster, nvme4 paths, 4-GPU FSDP (match orig world size).
defaults:
  - ../_cluster@_here_: entropy
  - ../_model/llama@_here_: projected_mem_eff_1B
  - ../_trainer@_here_: llama3_1B_distillation
  - ../_dataset@_here_: fineweb
  - ../_checkpoints@_here_: none
  - ../_misc@_here_: default

common:
  sequence_length: 1024
  batch_size: 512
  dmodel: 448 # 90% compression
  dff: 1728

trainer:
  _target_: src.projected_compression.trainer_distillation.PCDistillationTrainer
  gradient_accumulation_steps: 8
  n_steps: 4096   # ~2B tokens (single run, no grid)
  learning_rate: 12   # = HPD lr at 90%
  scheduler:
    warmup_steps: 40
  distributed:
    fsdp2: null
  eval_dataloader: None
  eval_interval: 0

  gradient_clipping: 0.25
  only_compress_model_gradient_clipping: false
  only_target_model_gradient_clipping: 1.0

  original_llama_path: meta-llama/Llama-3.2-1B  # unused: save type is nano
  checkpoint:
    save:
      interval: 0  # save only at the end
      path: /storage_nvme_4/nano/j321m/pc/checkpoints/pc_v2_pcd_90p_noP_lr12
      training_state_filename: __training_state_filename.pt
      type: nano   # avoid gated meta-llama HF access at save time

projected_compression:
  modules_to_shard:
    - src.projected_compression.mem_eff.CompressibleBlock
    - ${model.source_model.embedding._target_}
    - ${model.source_model.encoder.block_fn._target_}
    - ${model.source_model.head._target_}

  source_model_path: /storage_nvme_4/nano/j321m/pc/llama1b_in_nano.pt
  path_to_importances: /storage_nvme_4/nano/j321m/pc/importances/1b/minitron_dimensions_importances.pt

  init_norms_with_ones: false
  separate_block_optimizers: true
  adjust_grad_norm: false
  cpu_offload_projections: false
  source_model_for_distillation: true
  freeze_projections: true   # ablation: hold P1/P2 at init, train only W_b

distillation:
  load:
    type: pc_memeff_base

model:
  cast_bfloat16: false

infrastructure:
  server: entropy_j   # ssh alias -> user j321m (id_rsa)
  metric_logger:
    name: llama1_pcd_90p_noP_lr12_2BT
    new_wandb_job: true
    wandb_entity: ideas_cv
    project_name: pc_v2
    tags:
      - nano
      - pc
      - llama_1
      - projected_compression
      - distillation
      - mem_eff
      - 90p
      - hpd_lr
      - noP
      - wb_only

  slurm:
    job-name: ${infrastructure.metric_logger.name}
    partition: h100
    gres: "gpu:h100:4"   # match original 4-GPU FSDP world size
    time: "0-12:00:00"
