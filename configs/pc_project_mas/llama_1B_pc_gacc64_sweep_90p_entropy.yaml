# Batch-size probe for the PC-overhead timing experiment (paper Fig. 2).
# Full Llama-1B PC (no distillation) @ 90% on ONE H100, grad_acc=64, 10 steps, no checkpoint.
# Goal: step time of full-model PC vs batch size (100k..2M tokens) for the PC-vs-HP overhead curve.
# Goal: find the largest batch (tokens) that fits and measure step time.
# Batch = sequences of 1024 tokens: 16..1954 seqs = 16k..2.0M tokens.
defaults:
  - ../_cluster@_here_: entropy
  - ../_model/llama@_here_: projected_mem_eff_1B
  - ../_trainer@_here_: llama
  - ../_dataset@_here_: fineweb
  - ../_checkpoints@_here_: none
  - ../_misc@_here_: default

common:
  sequence_length: 1024
  batch_size: 128   # placeholder so run_exp can resolve ${common.batch_size}; overridden by ^batch_size
  ^batch_size: [128, 256, 320, 448, 512, 640, 704, 832, 896, 1024, 1088, 1216, 1280, 1408, 1472, 1600, 1664, 1792, 1856, 1984]   # every 100k tok up to 2M, rounded up to multiples of 64 seqs
  dmodel: 448 # 90p
  dff: 1728

trainer:
  _target_: src.projected_compression.trainer.PCTrainer
  gradient_accumulation_steps: 64
  n_steps: 10   # timing: mean of the last 7 steps
  learning_rate: 13
  scheduler:
    warmup_steps: 2   # must be < n_steps for the cosine scheduler
  distributed:
    fsdp2: null
  eval_dataloader: None
  eval_interval: 0

  gradient_clipping: 0.25
  only_compress_model_gradient_clipping: false
  only_target_model_gradient_clipping: 1.0

projected_compression:
  modules_to_shard:
    - src.projected_compression.mem_eff.CompressibleBlock
    - ${model.source_model.embedding._target_}
    - ${model.source_model.encoder.block_fn._target_}
    - ${model.source_model.head._target_}

  source_model_path: /storage_nvme_4/nano/j321m/pc/llama1b_in_nano.pt
  path_to_importances: /storage_nvme_4/nano/j321m/pc/importances/1b/minitron_dimensions_importances.pt

  init_norms_with_ones: false
  separate_block_optimizers: true
  adjust_grad_norm: false
  cpu_offload_projections: false

model:
  cast_bfloat16: false

infrastructure:
  server: entropy_j
  metric_logger:
    name: pc90_gacc64_sweep
    new_wandb_job: true
    wandb_entity: ideas_cv
    project_name: pc_time
    tags:
      - pc
      - llama_1
      - 90p
      - gacc64_sweep
      - 1gpu

  slurm:
    job-name: ${infrastructure.metric_logger.name}
    partition: h100
    gres: "gpu:h100:1"
    time: "0-00:30:00"
