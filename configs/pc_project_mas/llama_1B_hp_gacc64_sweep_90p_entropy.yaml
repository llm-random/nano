# Full Llama-1B HARD PRUNING (no distillation) @ 90% on ONE H100, grad_acc=64, 10 steps, no checkpoint.
# HP baseline for the PC-vs-HP overhead curve: same data, seq len, batch grid, steps and GPU as
# llama_1B_pc_gacc64_sweep_90p_entropy.yaml. Llama-3.2-1B is pre-downloaded into entropy's HF cache.
defaults:
  - ../_cluster@_here_: entropy
  - ../_model@_here_: llama_3_1
  - ../_trainer@_here_: llama
  - ../_dataset@_here_: fineweb
  - ../_checkpoints@_here_: none
  - ../_misc@_here_: default

common:
  sequence_length: 1024
  batch_size: 128   # placeholder so run_exp can resolve ${common.batch_size}; overridden by ^batch_size
  ^batch_size: [128, 256, 320, 448, 512, 640, 704, 832, 896, 1024, 1088, 1216, 1280, 1408, 1472, 1600, 1664, 1792, 1856, 1984]   # every 100k tok up to 2M, rounded up to multiples of 64 seqs
  target_dmodel: 448 # 90%
  target_dff: 1728

trainer:
  gradient_accumulation_steps: 64
  n_steps: 10   # timing: mean of the last 7 steps
  learning_rate: 11
  scheduler:
    warmup_steps: 2   # must be < n_steps for the cosine scheduler
  eval_dataloader: null
  eval_interval: 0
  checkpoint:
    load:
      type: huggingface
      path: "meta-llama/Llama-3.2-1B"

apply_functions:
  - _target_: src.projected_compression.pruning.prune
    _partial_: true
    dimensions_importances_path: /storage_nvme_4/nano/j321m/pc/importances/1b/minitron_dimensions_importances.pt
    target_dmodel: ${common.target_dmodel}
    target_dff: ${common.target_dff}

infrastructure:
  server: entropy_j   # ssh alias -> user j321m (id_rsa)
  metric_logger:
    name: hp90_gacc64_sweep
    new_wandb_job: true
    wandb_entity: ideas_cv
    project_name: pc_time
    tags:
      - hp
      - llama_1
      - 90p
      - gacc64_sweep
      - 1gpu

  slurm:
    job-name: ${infrastructure.metric_logger.name}
    partition: h100
    gres: "gpu:h100:1"
    time: "0-00:30:00"
