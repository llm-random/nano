defaults:
  # - ../_cluster@_here_: helios
  - ../_cluster@_here_: lem
  - ../_model@_here_: llama_3_1
  - ../_trainer@_here_: llama3_1B_distillation
  - ../_dataset@_here_: fineweb
  - ../_checkpoints@_here_: none
  - ../_misc@_here_: default


common:
  sequence_length: 1024
  batch_size: 512

  target_dmodel: 448 # 10
  target_dff: 1728
  # target_dmodel: 960 # 30
  # target_dff: 3840
  # target_dmodel: 1344 # 50
  # target_dff: 5376

  
trainer:
  # gradient_accumulation_steps: 16
  gradient_accumulation_steps: 8
  # gradient_accumulation_steps: 4
  ^n_steps: 
    - 2048
    - 4096
    - 8192
    - 12288

  # distillation_alpha: 1.0 ##########################

  # learning_rate: 12 #optimal fo 10%
  # learning_rate: 11 #optimal fo 30%
  # learning_rate: 11 #optimal fo 50%
  ^learning_rate: 
    - 9
    # - 10
    # - 11
    # - 13

  scheduler:
    warmup_steps: 40

  checkpoint:
   load:
    type: huggingface
    path: "meta-llama/Llama-3.2-1B" 
    
   save:  
    type: huggingface
    path: /lustre/pd03/plgrid/plgllmefficont3/mstefaniak/checkpoints/results # lem new
    
  eval_interval: 0
  eval_dataloader: None
  # train_dataloader:
  #   dataset:
  #     seed: 1000

infrastructure:
  metric_logger:
    name: Llame_HP
    tags:
      - nano
      - pc
      - llama_1
      - hard_pruning
      - distillation
      - only_distillation
      - 10p
      # - 30p
      # - 50p
  
  slurm:
    job-name: ${infrastructure.metric_logger.name}
    gres: "gpu:hopper:4" #lem
    # gres: gpu:4 #helios entropy
    # time: "1-00:00:00"
    time: "0-12:00:00"
 
apply_functions:
  - _target_: src.projected_compression.pruning.prune
    _partial_: true
    dimensions_importances_path: /lustre/pd01/plgrid/plgllmefficont2/projected_compression/importances/1b/minitron_dimensions_importances.pt #lem
    # dimensions_importances_path: /net/storage/pr3/plgrid/plggllmeffi/projected_compression/llama_1_fw_importances/minitron_dimensions_importances.pt #helios
    target_dmodel: ${common.target_dmodel}
    target_dff: ${common.target_dff}



