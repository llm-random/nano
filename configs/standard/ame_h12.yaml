# The standard AME model at h12: S2-PS (AME + ALiBi ladder + KV shift + sink)
# with the bank init sigma = 1e-4 and the banks at 4x the learning rate.
# Decided by Maciej on 2026-11-21 (documents/notes/standard_model_improvements.md,
# "Decisions"). One submit = 1 run.
#
# The recipe of W&B zdmv3qci (settle_runs_improve:
# configs/ame_improve/ame_h12_ps_bank4_std1e4.yaml, final_ce 3.0312); only the
# run name, tags and comments differ. Pair with zdmv3qci (or with 7te9jv9u,
# kf4q4t4s, doi36p8k): the same seed, data order, steps and schedule.
# No document mask and no bank gate (both rejected, 2026-11-21).
#
# Recipe v2 (2026-11-25; documents/notes/archive/review_issues.md, N6-N8): each part of
# the model now initializes from its own seed (src/core/init_rng.py), so the same
# seed builds other weights than for the runs named above, and the QK-norm keeps
# q and k in the compute dtype. These runs pair with those in data order, steps
# and schedule, not in init: hence the _v2 run name and the standard_v2 tag.
#
# Recipe v3 (2026-11-26, branch ame_f1; PR #200, ee6e3742 on pretraining-jm):
# the held-out set is the end of each of fineweb's 64 equal segments, not the
# corpus tail (one easy crawl), so final_ce now matches pretraining-jm's at the
# same sequence_length. The training rows shift with the cut: these runs pair
# with no earlier run, in final_ce or in train batches, hence the _v3 run name
# and the standard_v3 tag.
#
# Recipe v4 (2026-11-27, AME only): the feed-forward is dense's plus dmodel/3,
# rounded to a multiple of 32 (common.dff below; AMEm in
# documents/concepts/ame-model.md). AME has no W_Q or W_K and a full-width W_V,
# d^2 fewer attention weights per layer than dense GQA, and the wider FF puts
# them back: AME now matches the dense model of its H in active parameters and
# training FLOPs per token. The dense configs did not change and stay v3. Only
# the feed-forward inits differently from v3 at the same seed, so these runs
# pair with v3 AME in data order, steps, schedule and every other part's init,
# and with v3 dense in data order, steps and schedule: hence the _v4 run name
# and the standard_v4 tag.
defaults:
  - /base_schema
  - ../_misc@_here_: default
  - ../_cluster@_here_: lem
  - ../_model/h_balanced@_here_: h12
  - ../_trainer@_here_: llama
  - ../_dataset@_here_: fineweb
  - ../_checkpoints@_here_: none # save.path below switches on the final checkpoint
  - _self_

common:
  sequence_length: 2049 # the model sees 2048 = 16 x 128, so flex blocks align
  batch_size: 512 # sequences per optimizer step = 1,048,576 tokens
  # Recipe v4: 32 * round(26H/3) = 256H + 64H/3 rounded to 32, i.e. dense's
  # dff + dmodel/3 = 3072 + 256 = 3328. AME then has dense h12's active
  # parameters (a token reads one row of each bank) to +37,152, +0.02%: its
  # bank rows, sinks and scalars. Training FLOPs per token match to +0.01%.
  dff: ${eval:'32 * round(26 * ${common.h} / 3)'}
  # shift: true learns (alpha_1, alpha_2) and (beta_1, beta_2) per head and
  # layer. slopes is unset, so AME uses its ALiBi ladder (horizons 16 to 8192).
  # The sink and bank_gate: none are defaults.
  attention:
    type: ame
    ame:
      shift: true
      bank_init_std: 1.0e-4 # N(0, sigma^2) bank rows; also the code default under the QK-norm since 2026-11-25

compile_blocks_full: true

trainer:
  gradient_accumulation_steps: 16 # micro-batch 32
  mem_parallel_size: 1 # hand-managed bank path (Tier 2), banks unsharded
  distributed: null # no FSDP2: one precision path with the h12 and h16 references
  autocast_bf16: true

  # Everything not set here is a llama-trainer default: AdamW, weight decay
  # 0.1 (banks exempt), cosine schedule with 1% warmup to 10% of peak, eval
  # every 100 steps, final_ce on the fixed 8192 x 2048 held-out set.
  n_steps: 3815 # D = 4B tokens / 1,048,576 tokens per step, as the references
  n_tokens_b: null
  learning_rate: 8 # LR = 2^-8
  bank_lr_ratio: 4.0 # banks at 4 x 2^-8 for the whole schedule (also the default)
  checkpoint:
    save:
      path: checkpoint # final checkpoint only

infrastructure:
  slurm:
    gres: gpu:hopper:1
    job-name: std_ame_h12
    time: "0-07:00:00" # the run takes about 4.5 h on LEM; no mid-run checkpoints
    exclude: r16-11 # bad GPU (2026-11-06)
  metric_logger:
    project_name: nano-ame
    name: std_ame_h12_lr8_v4
    tags:
      - ame
      - h12
      - standard
      - standard_v4
      - bank_lr4
      - bank_std1e4
      - dff_matched
