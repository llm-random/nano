# @package _global_
defaults:
#   - /_cluster/helios@_here_
  - /_cluster/lem@_here_
  - /_model/tiny@_here_
  - /_trainer/llama@_here_
  - /_dataset/sst2@_here_
  - /_checkpoints/none@_here_
  - /_misc/default@_here_
  - _self_

common:
  batch_size: 64
  datt: 1024
  dff: 2724
  dmodel: 1024
  kv_heads: 16
  n_blocks: 16
  q_heads: 16
  sequence_length: 1024
  vocab_size: 50304


trainer:
  _target_: src.product_keys.finetuning_trainer.FinetuningTrainer
  eval_interval: 25
  gradient_accumulation_steps: 4
  # n_steps: 20000
  n_steps: 2300 # 5 epochs
  full_eval_rows: 2000
  # learning_rate: 2e-4
  # ^learning_rate: [1e-4, 2e-4, 5e-4, 1e-3, 2e-3]
  ^learning_rate: [1e-5, 2e-5, 5e-5, 5e-3]
  freeze_backbone: false
  trainable_modules: ["head"]
  d_model: ${common.dmodel}
  vocab_size: ${common.vocab_size}

  scheduler:
    _partial_: true
    _target_: src.core.schedulers.get_cosine_scheduler_with_warmup
    final_lr_fraction: 0.1
    warmup_steps: ${eval:'int(${trainer.n_steps} * 0.10)'}

  train_dataloader:
    dataset:
      tokenize_fn:
        seq_len: ${common.sequence_length}

  eval_dataloader:
    collate_fn:
      _target_: src.product_keys.datasets.glue_split_collate_wrapper
      _partial_: true
    dataset:
      _target_: src.product_keys.datasets.GlueLengthSplitDataset
      split_values: [256, 512]
      shuffle: false
      tokenize_fn:
        seq_len: ${common.sequence_length}

  checkpoint:
    load:
      type: nano
      path: /lustre/pd03/plgrid/plgllmefficont3/pk_attention/model_checkpoints/5110804/0/step_80000
      # path: /net/storage/pr3/plgrid/plggllmeffi3/pk_attention/finetune_checkpoints/baseline_full_run
      model_checkpoint_filename: model_checkpoint.pt
      training_state_filename: training_state.pt
      only_weights: true 

    save:
      type: nano
      interval: 4000

infrastructure:
  metric_logger:
    type: wandb
    wandb_entity: ideas_cv
    project_name: tml-bgw
    name: baseline-finetunetrainer-split-eval-${trainer.train_dataloader.dataset.task_name}-lr
    tags:
      - nano
      - pk_mlm
      - finetuning
      - "seq_len=${common.sequence_length}"
      - "n_layers=${common.n_blocks}"
      - "lr=${trainer.learning_rate}"

  slurm:
    # gres: gpu:4
    gres: gpu:hopper:4
    time: "0-06:00:00"
    job-name: ${infrastructure.metric_logger.name}

model:
  _target_: src.projected_compression.model.LLM

  embedding:
    _target_: src.projected_compression.model.TransformerEmbedding
    vocab_size: ${common.vocab_size}
    dmodel: ${common.dmodel}
    init_fn:
      _target_: src.projected_compression.model.trunc_normal_
      _partial_: true

  encoder:
    _target_: src.projected_compression.model.TransformerEncoder
    n_blocks: ${common.n_blocks}
    block_fn:
      _target_: src.projected_compression.model.TransformerBlock
      _partial_: true
      norm_fn:
        _target_: src.core.model.RMSNorm
        _partial_: true
        eps: 1e-5
        normalized_shape: ${common.dmodel}

      attention_fn:
        _target_: src.projected_compression.model.RoPEAttention
        _partial_: true
        dmodel: ${common.dmodel}
        q_heads: ${common.q_heads}
        kv_heads: ${common.kv_heads}
        seq_len: ${common.sequence_length}
        causal: false

        q_proj_fn:
          _target_: src.projected_compression.model.Linear
          _partial_: true
          in_features: ${common.dmodel}
          out_features: ${common.datt}
          partial_init_fn:
            _target_: src.projected_compression.model.llm_random_weight_init
            _partial_: true
            scale: 1

        k_proj_fn:
          _target_: src.projected_compression.model.Linear
          _partial_: true
          in_features: ${common.dmodel}
          out_features: ${eval:'(${common.datt} // ${model.encoder.block_fn.attention_fn.q_heads}) * ${model.encoder.block_fn.attention_fn.kv_heads}'}
          partial_init_fn:
            _target_: src.projected_compression.model.llm_random_weight_init
            _partial_: true
            scale: 1

        v_proj_fn: ${model.encoder.block_fn.attention_fn.k_proj_fn}

        # o_proj_fn: ${model.encoder.block_fn.attention_fn.q_proj_fn} # TODO check have I done it right pls
        o_proj_fn: 
          _target_: src.projected_compression.model.Linear
          _partial_: true
          in_features: ${common.datt}
          out_features: ${common.dmodel}
          partial_init_fn:
            _target_: src.projected_compression.model.llm_random_weight_init
            _partial_: true
            scale: 1

        rope_base: 500000
        rope_scale_freqs: true

      ff_layer_fn:
        _target_: src.projected_compression.model.ProjectedLlamaFeedForward
        _partial_: true
        ff_pre_act_fn:
          _target_: src.projected_compression.model.Linear
          _partial_: true
          in_features: ${common.dmodel}
          out_features: ${common.dff}
          partial_init_fn:
            _target_: src.projected_compression.model.llm_random_weight_init
            _partial_: true
            scale: 1
        ff_post_act_fn:
          _target_: src.projected_compression.model.Linear
          _partial_: true
          in_features: ${common.dff}
          out_features: ${common.dmodel}
          partial_init_fn:
            _target_: src.projected_compression.model.llm_random_weight_init
            _partial_: true
            scale: 1
        gate_fn: ${model.encoder.block_fn.ff_layer_fn.ff_pre_act_fn}

  head:
    _target_: src.projected_compression.model.TransformerHead
    linear_fn:
      _target_: src.projected_compression.model.Linear
      _partial_: true
      in_features: ${common.dmodel}
      out_features: ${common.vocab_size}
      partial_init_fn:
        _target_: src.projected_compression.model.llm_random_weight_init
        _partial_: true
        scale: 1
    norm_fn:
      _target_: src.core.model.RMSNorm
      _partial_: true
      eps: 1e-5
      normalized_shape: ${common.dmodel}

