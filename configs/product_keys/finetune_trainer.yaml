# @package _global_
defaults:
  - /_cluster/lem@_here_
  # - /_cluster/helios@_here_
  - /_model/tiny@_here_
  - /product_keys/pk_model@_here_
  - /_trainer/llama@_here_
  # - /_dataset/sst2@_here_
  - /_dataset/mnli@_here_
  - /_checkpoints/none@_here_
  - /_misc/default@_here_
  - _self_

common:
  batch_size: 64
  datt: 1024
  dff: 2724
  dmodel: 1024
  kv_heads: 16
  n_blocks: 16
  q_heads: 16
  sequence_length: 1024
  vocab_size: 50304


trainer:
  _target_: src.product_keys.finetuning_trainer.FinetuningTrainer
  
  gradient_accumulation_steps: 4
  n_steps: 20000
  # n_steps: 4000
  full_eval_rows: 2000
  ^learning_rate: [2e-4, 5e-4, 1e-3, 2e-3]
  d_model: ${common.dmodel}
  vocab_size: ${common.vocab_size}


  scheduler:
    _partial_: true
    _target_: src.core.schedulers.get_cosine_scheduler_with_warmup
    final_lr_fraction: 0.1
    warmup_steps: ${eval:'int(${trainer.n_steps} * 0.10)'}

  train_dataloader:
    dataset:
      tokenize_fn:
        seq_len: ${common.sequence_length}

  eval_dataloader:
    dataset:
      tokenize_fn:
        seq_len: ${common.sequence_length}

  checkpoint:
    load:
      type: nano
      path: /lustre/pd03/plgrid/plgllmefficont3/pk_attention/model_checkpoints/5110806/0/step_80000
      # path: /net/storage/pr3/plgrid/plggllmeffi3/pk_attention/finetune_checkpoints/pk_attn_full_run
      model_checkpoint_filename: model_checkpoint.pt
      training_state_filename: training_state.pt
      only_weights: true 

    save:
      type: nano
      interval: 4000
      path: null
      # path: /lustre/pd03/plgrid/plgllmefficont3/pk_attention/model_checkpoints/


infrastructure:
  metric_logger:
    type: wandb
    wandb_entity: ideas_cv
    project_name: tml-bgw
    name: pk_mlm-finetunetrainer-mnli-${now:%Y-%m-%d_%H-%M-%S}
    tags:
      - nano
      - pk_mlm
      - "seq_len=${common.sequence_length}"
      - "n_layers=${common.n_blocks}"
      - "lr=${trainer.learning_rate}"

  slurm:
    # gres: gpu:4
    gres: gpu:hopper:4
    time: "1-00:00:00"
    job-name: ${infrastructure.metric_logger.name}

