# Branches a 50-step decay off tiny_local_wsd_stable's step-100 checkpoint (run that first).
defaults:
  - tiny_local_wsd
  - _self_

trainer:
  n_steps: 151
  scheduler:
    decay_steps: 50

  checkpoint:
    save:
      path: null
    load:
      path: checkpoint/tiny_local_wsd_stable/step_100
      training_state_filename: __training_state_filename.pt
      only_weights: false

infrastructure:
  metric_logger:
    name: tiny_local_wsd_branch
    tags:
      - nano
      - local
      - tiny
      - wsd
