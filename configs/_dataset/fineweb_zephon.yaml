# Train and eval data streamed by zephon from the Hugging Face hub
# (src/core/zephon_dataset.py), from different files: fineweb-edu is one directory per
# Common Crawl dump, eval is the latest dump (CC-MAIN-2025-26, 50 files, 14.0M docs) and
# train is config `default` (all 110 dumps, 2410 files) without that dump's files.
#
# Both paths are frozen URIs pinned to the commit the shard indexes were built from;
# a plain hf://HuggingFaceFW/fineweb-edu/<config>/train would need datasets>=4.4 to
# resolve. Indexes: build-index once per URI into cluster_switch.zephon_index_dir.
defaults:
  - default
  - _self_


trainer:
  train_dataloader:
    dataset:
      _target_: src.core.zephon_dataset.ZephonDataset
      name: fineweb_edu
      sequence_length: ${common.sequence_length}
      total_batch_size: ${common.batch_size}
      hf_path: "hf://HuggingFaceFW/fineweb-edu@87f09149ef4734204d70ed1d046ddc9ca3f2b8f9~original/default/train"
      # The eval dump; must match eval's hf_path config below.
      exclude_prefixes:
        - "data/CC-MAIN-2025-26/"
      cache_dir: ${cluster_switch.zephon_cache_dir}
      index_dir: ${cluster_switch.zephon_index_dir}
      tokenizer_id: "meta-llama/Llama-3.1-8B"
      seed: 123
      # Lanes: the data order is fixed by these, not by the GPU count. 4 = one lane per
      # GPU on a 4-GPU node; a resume on 2 or 1 GPUs sees the same global batches.
      canonical_replicas: 4
      cache_limit_gb: 200
      tokenize_parallelism: 8
      prefetch_parallelism: 8
    # zephon runs its own fetch/tokenize threads; DataLoader workers would split the
    # lanes again by worker.
    num_workers: 0

  eval_dataloader:
    dataset:
      _target_: src.core.zephon_dataset.ZephonDataset
      # A different name and cache_dir from train: zephon cannot share one cache between
      # two datasets, and both pipelines are alive in the same process.
      name: fineweb_edu_eval
      sequence_length: ${common.sequence_length}
      total_batch_size: ${common.batch_size}
      hf_path: "hf://HuggingFaceFW/fineweb-edu@87f09149ef4734204d70ed1d046ddc9ca3f2b8f9~original/CC-MAIN-2025-26/train"
      cache_dir: ${cluster_switch.zephon_cache_dir}_eval
      index_dir: ${cluster_switch.zephon_index_dir}
      tokenizer_id: "meta-llama/Llama-3.1-8B"
      seed: 123
      canonical_replicas: 4
      # A fixed eval set: every eval restarts the stream, so these are the same 8192
      # rows (8192 x sequence_length tokens) each time, at any world size.
      max_samples: 8192
      cache_limit_gb: 50
      tokenize_parallelism: 4
      prefetch_parallelism: 4
    num_workers: 0
