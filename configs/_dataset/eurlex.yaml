defaults:
  - default
  - _self_

trainer:
  num_labels: 100

  train_dataloader:
    collate_fn: 
      _target_: src.product_keys.datasets.glue_collate_wrapper
      _partial_: true
    dataset:
      _target_: src.product_keys.datasets.GlueDataset
      sequence_length: ${common.sequence_length}
      tokenize_fn:
        _target_: src.product_keys.datasets.glue_tokenize_fn
      task_name: eurlex
      path:  ${cluster_switch.train_path_eurlex}
      split: train
      seed: 123
      use_new_sampling_method: true
      shuffle: true
      world_size_independent: false
    num_workers: 8

  eval_dataloader:
    collate_fn: 
      _target_: src.product_keys.datasets.glue_collate_wrapper
      _partial_: true
    dataset:
      _target_: src.product_keys.datasets.GlueDataset
      sequence_length: ${common.sequence_length}
      tokenize_fn:
        _target_: src.product_keys.datasets.glue_tokenize_fn
      task_name: eurlex
      path: ${cluster_switch.eval_path_eurlex}
      split: test
      seed: 123
      use_new_sampling_method: true
      shuffle: true
      world_size_independent: false
    num_workers: 8
