defaults:
  - default
  - _self_

trainer:
  num_labels: 3
  n_eval_steps: 30

  train_dataloader:
    collate_fn: 
      _target_: src.product_keys.datasets.glue_collate_wrapper
      _partial_: true
    dataset:
      _target_: src.product_keys.datasets.GlueDataset
      tokenize_fn:
        _target_: src.product_keys.datasets.glue_2_sentences_tokenize_fn
      task_name: mnli
      sequence_length: ${common.sequence_length}
      path:  ${cluster_switch.train_path_mnli}
      split: train
      seed: 123
      use_new_sampling_method: true
      shuffle: true
      world_size_independent: false
    num_workers: 8

  eval_dataloader:
    collate_fn: 
      _target_: src.product_keys.datasets.glue_collate_wrapper
      _partial_: true
    dataset:
      _target_: src.product_keys.datasets.GlueDataset
      tokenize_fn:
        _target_: src.product_keys.datasets.glue_2_sentences_tokenize_fn
      task_name: mnli
      sequence_length: ${common.sequence_length}
      path: ${cluster_switch.eval_path_mnli}
      split: validation
      seed: 123
      use_new_sampling_method: true
      shuffle: true
      world_size_independent: false
    num_workers: 8
