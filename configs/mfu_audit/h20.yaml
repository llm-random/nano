# h20 on one H100, in the measured-best single-GPU configuration.
#
# 30 steps, 512 sequences x 2048 tokens per step (1,048,576 tokens). Eval and
# checkpointing are off so nothing but the training loop sits inside the timing
# window.
#
# The compile/parallelism settings below are the Part 4.4 / 6.3 recipe from
# documents/notes/training_efficiency.md, measured at 46.4% MFU on this exact
# architecture (job 32023, 3.97 GFLOPs/token). They were previously left at the
# unoptimised audit defaults, which measure 30.8% -- the stage-3 backbone
# baseline. That baseline is what h12.yaml and h16.yaml still carry, so the
# ladder in training_efficiency.md Part 4 is unaffected by this file.
#
#   distributed: null     no FSDP2. At world size 1 it is a ~0.5pt loss under
#                         compile (training_efficiency.md 6.4), and dropping it
#                         is what lets the whole model compile as one graph.
#   compile_model: true   whole-model compile, one inductor graph including the
#                         Residual glue that regional compile_blocks leaves
#                         eager -- worth ~11 MFU points.
#   compile_loss: true    the measured-best addition on top of compile_model.
#   autocast_bf16: true   required by the recipe.
#   grad accum 32         micro-batch 16, the probed value for h20.
#
# This config is single-GPU only: without FSDP2 there is no gradient
# synchronisation, so do not raise gres above gpu:h100:1. For 2+ GPUs use
# h20_mgpu.yaml, which keeps FSDP2 and compiles each whole TransformerBlock
# (`+compile_blocks_full=true`) -- still regional compile, so the compiled unit
# is the sharded unit. Measured 45.57% at 1 GPU and 44.28% at 4, so the FSDP2
# path no longer costs anything against the recipe below
# (documents/notes/multigpu_efficiency.md).
defaults:
  - /base_schema
  - ../_misc@_here_: default
  - ../_cluster@_here_: entropy
  - ../_model/h_balanced@_here_: h20
  - ../_trainer@_here_: llama
  - ../_dataset@_here_: fineweb
  - ../_checkpoints@_here_: none
  - _self_

common:
  sequence_length: 2048
  batch_size: 512

trainer:
  n_steps: 30
  learning_rate: 0.000244140625 # 2^-12
  gradient_accumulation_steps: 32 # micro-batch 16, the probed value for h20
  eval_interval: 0
  eval_dataloader: null
  distributed: null # single-GPU only -- see the header
  autocast_bf16: true
  compile_loss: true
  scheduler:
    warmup_steps: 10

# Top-level, not a trainer key: main.py reads it off the config root
# (`cfg.get("compile_model")`), so on the CLI it keeps its `+`.
compile_model: true

infrastructure:
  slurm:
    gres: gpu:h100:1
    job-name: mfu_h20
    time: "0-01:00:00"
  metric_logger:
    project_name: nano-mfu-audit
    name: mfu_h20_s2048_b512
    tags:
      - mfu_audit
      - h20
