# Stage-3 audit E1: the whole pipeline end to end on the cheap h4 before any
# big-model time -- submission, offline NeoX, wandb, loss sanity, token accounting.
# 30 steps of h4 on one entropy H100, 512 sequences x 2048 tokens per step
# (1,048,576 tokens). Eval and checkpointing are off so nothing but the training
# loop sits inside the timing window; gradient_accumulation_steps starts safe and
# the micro-batch probe overrides it per model.#
# Single-GPU, no FSDP2 -- the default for every h-size config in this directory
# (multi-GPU is an explicit opt-in: see h20_mgpu.yaml). `distributed: null`
# makes the model a plain module, so `autocast_bf16: true` is REQUIRED with it:
# FSDP2's MixedPrecisionPolicy was what provided bf16, and without either the
# run silently trains in fp32 at roughly a sixth of the speed (the fp32 control
# rows in documents/notes/training_efficiency.md Part 1.3).
# Deliberately NOT compiled: this is the pipeline smoke test, where time to
# first step matters more than throughput, and compiling 4 blocks would add
# minutes to a check meant to fail fast.
defaults:
  - /base_schema
  - ../_misc@_here_: default
  - ../_cluster@_here_: entropy
  - ../_model/h_balanced@_here_: h4
  - ../_trainer@_here_: llama
  - ../_dataset@_here_: fineweb
  - ../_checkpoints@_here_: none
  - _self_

common:
  sequence_length: 2048
  batch_size: 512

trainer:
  n_steps: 30
  learning_rate: 0.000244140625 # 2^-12
  gradient_accumulation_steps: 8 # micro-batch 64 x 2048: h4 is small
  eval_interval: 0
  eval_dataloader: null
  distributed: null # single-GPU: no FSDP2 -- see the header
  autocast_bf16: true # required once distributed is null, or this runs fp32
  scheduler:
    warmup_steps: 10

infrastructure:
  slurm:
    gres: gpu:h100:1
    job-name: mfu_h4
    time: "0-01:00:00"
  metric_logger:
    project_name: nano-mfu-audit
    name: mfu_h4_s2048_b512
    tags:
      - mfu_audit
      - h4
