infrastructure:
  server: entropy
  max_concurrent_jobs: null
  slurm:
    cpus_per_gpu: 20
    gres: ???
    job-name: test
    mem_per_gpu: 90G
    nodes: 1
    partition: h100
    time: "2-00:00:00"
    
  script:
    - '${export_env_variables_placeholders:}'
    - 'export PROJECT_HOME_PATH=/storage_nvme_3/mstefaniak/pc'
    - 'export HF_HOME=$PROJECT_HOME_PATH/hf_cache'
    - 'export HF_DATASETS_CACHE="$PROJECT_HOME_PATH/hf_datasets"'
    - 'export HF_MODULES_CACHE="$PROJECT_HOME_PATH/hf_modules"'
    - 'export HF_DATASETS_TRUST_REMOTE_CODE=1'

    # hydra errors
    - 'export HYDRA_FULL_ERROR=1'

    # export pixi variables
    - 'export PIXI_HOME=/storage_nvme_4/nano/pixi_new'
    - 'export PATH="$PIXI_HOME/bin:$PATH"'
    - 'export XDG_DATA_HOME="$PIXI_HOME/data"'
    - 'export XDG_CACHE_HOME="$PIXI_HOME/cache"'
    - 'export XDG_STATE_HOME="$PIXI_HOME/state"'
    
    # activate pixi
    - 'cd "$PIXI_HOME"'
    - 'eval "$(pixi shell-hook)"'
    - 'cd -'

cluster_switch:
  train_path_c4: "/storage_nvme_1/llm-random/datasets/c4/train"
  eval_path_c4: "/storage_nvme_1/llm-random/datasets/c4/validation"
  train_path_fineweb: "/storage_nvme_4/llm-random/datasets/fineweb/train"
  eval_path_fineweb: "/storage_nvme_4/llm-random/datasets/fineweb/train"
  train_path_smollm_fineweb_edu: "/storage_nvme_1/llm-random/datasets/fineweb-edu-dedup/train"
  train_path_smollm_cosmopedia: "/storage_nvme_1/llm-random/datasets/cosmopedia-v2/train"
  train_path_smollm_python_edu: "/storage_nvme_2/llm-random/datasets/python-edu"
  train_path_smollm_open_web_math: "/storage_nvme_2/llm-random/datasets/open-web-math/train"
