# entropy_user with zephon: a separate pixi environment that has zephon in it, the zephon
# cache and shard index, and an eval set readable by this account.
#
# The environment is the repo's pixi.toml plus zephon in $PROJECT_HOME_PATH/pixi_zephon
# (/storage_nvme_4/$USER is visible only on h100a, so install it in a job there):
#   cp <repo>/pixi.toml <repo>/pixi.lock . && pixi add --pypi "zephon[parquet]==0.2.1"
# See lem_zephon_user.yaml for why zephon[parquet] and why not in the repo's pixi.lock.
#
# eval_path_fineweb: the shared fineweb copy on entropy is not readable by every
# account, so this is a copy of exactly the eval holdout of lem's fineweb (its last
# 262144 rows) -- the variant sets holdout: null to read all of it. Same rows, same
# order, so eval numbers compare across the two clusters.
# Only `script` is restated (Hydra replaces lists); keep it in step with entropy_user.yaml.
defaults:
  - entropy_user
  - _self_

infrastructure:
  server: entropy
  max_concurrent_jobs: null

  slurm:
    cpus_per_gpu: 14
    gres: "gpu:h100:4"
    job-name: test
    mem_per_gpu: 90G
    nodes: 1
    partition: h100
    time: "1-00:00:00"

  script:
    - '${export_env_variables_placeholders:}'
    # Secrets kept on the cluster, one file each (dir 700, files 600), read when the job
    # starts so the values never reach git, the job script or the logs. They only fill
    # a variable the submitting shell did not already forward through run_exp.py.
    - 'SECRETS_DIR=$HOME/.config/bdd/secrets'
    - 'if [ -z "$WANDB_API_KEY" ] && [ -s "$SECRETS_DIR/wandb_api_key" ]; then export WANDB_API_KEY="$(cat "$SECRETS_DIR/wandb_api_key")"; fi'
    - 'if [ -z "$HF_TOKEN" ] && [ -s "$SECRETS_DIR/hf_token" ]; then export HF_TOKEN="$(cat "$SECRETS_DIR/hf_token")"; fi'
    - 'export PROJECT_HOME_PATH=/storage_nvme_4/$USER'
    - 'export HF_HOME=$PROJECT_HOME_PATH/hf_cache'

    # hydra errors
    - 'export HYDRA_FULL_ERROR=1'

    # export pixi variables
    - 'export PIXI_HOME=$PROJECT_HOME_PATH/pixi_zephon'
    - 'export PATH="$HOME/.pixi/bin:$PATH"'
    - 'export XDG_DATA_HOME="$PIXI_HOME/data"'
    - 'export XDG_CACHE_HOME="$PIXI_HOME/cache"'
    - 'export XDG_STATE_HOME="$PIXI_HOME/state"'
    - 'export RATTLER_CACHE_DIR="$XDG_CACHE_HOME/rattler"'
    - 'export PIXI_CACHE_DIR="$XDG_CACHE_HOME/pixi"'

    # activate pixi
    - 'cd "$PIXI_HOME"'
    - 'eval "$(pixi shell-hook)"'
    - 'cd -'


cluster_switch:
  nano_user_dir: "/storage_nvme_4/${oc.env:USER}/nano"
  eval_path_fineweb: "/storage_nvme_4/${oc.env:USER}/nano/fineweb_eval_holdout"
  zephon_cache_dir: "/storage_nvme_4/${oc.env:USER}/zephon/fineweb_edu"
  zephon_index_dir: "/storage_nvme_4/${oc.env:USER}/zephon/index"
