infrastructure:
  server: helios
  max_concurrent_jobs: null

  # $HOME on helios is at ~84% of its 100k inode quota, and a nano clone is ~340 files
  # per experiment. Keep the cemetery clones on group storage. See _misc/default.yaml
  # for why this is cluster_cemetery_dir and not cemetery_experiments_dir.
  cluster_cemetery_dir: "/net/storage/pr3/plgrid/plggllmeffi3/pc/$USER/llmrandom_cemetery"
  slurm:
    # Per GPU: 32 of the node's 72 CPUs, and its RAM share minus 10G, rounded down. A node
    # has 4 GPUs, 288 CPUs and 478.0G allocatable: 119.5G per GPU.
    cpus_per_gpu: 32
    gres: ???
    job-name: test
    mem_per_gpu: 109G
    nodes: 1
    partition: plgrid-gpu-gh200
    time: "2-00:00:00"

  script:
    - '${export_env_variables_placeholders:}'
    - 'module load ML-bundle/25.04'
    - 'export PROJECT_HOME_PATH=$PLG_GROUPS_STORAGE/plggllmeffi3/pc'
    - 'export HF_HOME=$PROJECT_HOME_PATH/hf_cache'
    - 'export HF_DATASETS_CACHE="$PROJECT_HOME_PATH/hf_datasets"'
    - 'export HF_MODULES_CACHE="$PROJECT_HOME_PATH/hf_modules"'
    
    
    # hydra errors
    - 'export HYDRA_FULL_ERROR=1'
    
    # export pixi variables
    - 'export PIXI_HOME=$PROJECT_HOME_PATH/$USER/pixi'
    - 'export PATH="$HOME/.pixi/bin:$PATH"'

    # hardfixes
    - 'export XDG_DATA_HOME="$PROJECT_HOME_PATH/data"'
    - 'export XDG_CACHE_HOME="$PROJECT_HOME_PATH/cache"'
    - 'export XDG_STATE_HOME="$PROJECT_HOME_PATH/state"'
    - 'export RATTLER_CACHE_DIR="$XDG_CACHE_HOME/rattler"'
    - 'export UV_CACHE_DIR="$XDG_CACHE_HOME/uv"'
    - 'export PIXI_CACHE_DIR="$XDG_CACHE_HOME/pixi"'
    
    # HF datasets requires explicit opt-in for datasets with custom code (e.g. allenai/social_i_qa)
    - 'export HF_DATASETS_TRUST_REMOTE_CODE=1'

    # activate pixi
    - 'cd "$PIXI_HOME"'
    - 'eval "$(pixi shell-hook)"'
    - 'cd -'

    # FineWeb: read the copy on $SCRATCH while it is fresh, else group storage.
    # Opening FineWeb walks 1.3M record-batch headers, one small random read each, and a job
    # opens it twice (train and eval split). Group storage answers a cold read in ~23 ms, so a
    # job spent ~32 min before step 1; $SCRATCH answers in ~0.35 ms.
    # $SCRATCH deletes files 30 days after creation, so scripts/helios_fineweb_scratch.sh
    # re-creates the copy every 2 weeks. Its .complete stamp is dated to the copy's oldest
    # file: older than 28 days means the purge is 2 days away, so fall back.
    # Per user: without a copy in your own $SCRATCH, this stays the group-storage path.
    - 'export FINEWEB_DIR=/net/storage/pr3/plgrid/plggllmeffi3/datasets/fineweb/train'
    - 'if [ -n "$(find "$SCRATCH/datasets/fineweb/train/.complete" -mtime -28 2>/dev/null)" ]; then export FINEWEB_DIR="$SCRATCH/datasets/fineweb/train"; fi'
    - 'echo "FineWeb: $FINEWEB_DIR"'

cluster_switch:
  train_path_c4: "/net/storage/pr3/plgrid/plggllmeffi3/datasets/c4/train"
  eval_path_c4: "/net/storage/pr3/plgrid/plggllmeffi3/datasets/c4/validation"
  # FINEWEB_DIR is set at run time by the script block above: the scratch copy or group storage.
  # The default only matters where nothing sets it (e.g. resolving the config on a laptop).
  train_path_fineweb: "${oc.env:FINEWEB_DIR,/net/storage/pr3/plgrid/plggllmeffi3/datasets/fineweb/train}"
  eval_path_fineweb: "${oc.env:FINEWEB_DIR,/net/storage/pr3/plgrid/plggllmeffi3/datasets/fineweb/train}"
