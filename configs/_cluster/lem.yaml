infrastructure:
  server: lem
  max_concurrent_jobs: null
  slurm:
    gres: "gpu:hopper:4"
    # TEMPORARY (2026-07): WCSS lem filter can't parse --mem-per-gpu/--cpus-per-gpu and rejects valid jobs; emit totals derived from gres (16 CPU / 220G per GPU). Revert to cpus_per_gpu/mem_per_gpu once admins fix the filter.
    cpus-per-task: "${eval:'16 * int(\"${infrastructure.slurm.gres}\".split(\":\")[-1])'}"
    mem: "${eval:'str(220 * int(\"${infrastructure.slurm.gres}\".split(\":\")[-1])) + \"G\"'}"
    job-name: test
    nodes: 1
    partition: plgrid-lem-gpu-h100
    time: "1-00:00:00"
    account: "plgllmefficont3"

  script:
    - 'ml CUDA/12.4.0'
    - '${export_env_variables_placeholders:}'
    - 'export PROJECT_HOME_PATH=/lustre/pd03/plgrid/plgllmefficont3/nano/$USER'
    - 'export HF_HOME=$PROJECT_HOME_PATH/hf_cache'

    # hydra errors
    - 'export HYDRA_FULL_ERROR=1'

    # export pixi variables
    - 'export HF_DATASETS_CACHE="$PROJECT_HOME_PATH/hf_datasets"'
    - 'export HF_MODULES_CACHE="$PROJECT_HOME_PATH/hf_modules"'
    - 'export PIXI_HOME=$PROJECT_HOME_PATH/pixi'
    - 'export PATH="$HOME/.pixi/bin:$PATH"'

    # HF datasets requires explicit opt-in for datasets with custom code (e.g. allenai/social_i_qa)
    - 'export HF_DATASETS_TRUST_REMOTE_CODE=1'

    # activate pixi
    - 'cd "$PIXI_HOME"'
    - 'eval "$(pixi shell-hook)"'
    - 'cd -'

cluster_switch:
  train_path_c4: "/lustre/pd01/plgrid/plgllmefficont2/datasets/c4/train"
  eval_path_c4: "/lustre/pd01/plgrid/plgllmefficont2/datasets/c4/validation"
  train_path_fineweb: "/lustre/pd01/plgrid/plgllmefficont2/crewtool/proba2/fineweb-edu/train/train"
  eval_path_fineweb: "/lustre/pd01/plgrid/plgllmefficont2/crewtool/proba2/fineweb-edu/train/train"
