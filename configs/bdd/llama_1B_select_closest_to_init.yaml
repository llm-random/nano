# Choose the FFN channels of Llama-3.2-1B closest to the init distribution
# (src/projected_compression/channel_selectors.py:select_closest_to_init) for several
# keep fractions, and save each as a ChannelSelection JSON. No training: the job runs
# src/projected_compression/channel_selection_job.py on a compute node, because lem
# does not allow computation on the login node.
#
# Grid: keep_pct = 30..90, one SLURM array task each. The kept dff is
# keep_pct / 100 * 8192 rounded to the nearest multiple of 8:
#   30 -> 2456, 40 -> 3280, 50 -> 4096, 60 -> 4912, 70 -> 5736, 80 -> 6552, 90 -> 7376
#
#   python run_exp.py --config-path configs/bdd --config-name llama_1B_select_closest_to_init
#
# Output: /lustre/pd03/plgrid/plgllmefficont3/nano/$USER/channel_selection/llama_1B/
#         closest_to_init_huggingface_keep{30..90}.json
# Use one in training with
#   apply_functions:
#     - _target_: src.projected_compression.pruning.prune_from_selection
#       _partial_: true
#       selection_path: <that file>
defaults:
  - ../_cluster@_here_: lem_user
  - ../_model@_here_: llama_3_1
  - ../_trainer@_here_: llama
  - ../_dataset@_here_: fineweb
  - ../_checkpoints@_here_: none
  - ../_misc@_here_: default
  - _self_


init_model_opt_sched_fn:
  _target_: src.projected_compression.channel_selection_job.run_channel_selection
  _partial_: true


common:
  ^keep_pct:
    - 30
    - 40
    - 50
    - 60
    - 70
    - 80
    - 90
  # Placeholder for run_exp.py, which resolves the config before expanding the grid;
  # every grid point overwrites it with its ^keep_pct value.
  keep_pct: 0
  reference: huggingface
  # Unused (no training); the trainer and dataset configs interpolate them.
  sequence_length: 1024
  batch_size: 512


channel_selection:
  source_model: "meta-llama/Llama-3.2-1B"
  selector:
    _target_: src.projected_compression.channel_selectors.select_closest_to_init
    _partial_: true
    keep_fraction: ${eval:'${common.keep_pct} / 100'}
    reference: ${common.reference}
    init_std: 0.02
    n_random: 2000
    seed: 0
    max_steps: 3000
    multiple_of: 8
  notes: "configs/bdd/llama_1B_select_closest_to_init.yaml"
  # ${oc.env:USER} resolves on the compute node (generated configs are dumped unresolved).
  save_dir: "/lustre/pd03/plgrid/plgllmefficont3/nano/${oc.env:USER}/channel_selection/llama_1B"
  save_name: "closest_to_init_${common.reference}_keep${common.keep_pct}"


trainer:
  distributed: null
  n_steps: 1  # unused (no training); keeps the trainer's interpolations resolvable


infrastructure:
  slurm:
    job-name: bdd_select
    # CPU work (a few minutes per keep fraction on a laptop); one GPU is the smallest
    # allocation on this partition.
    gres: "gpu:hopper:1"
    time: "0-02:00:00"
  metric_logger:
    type: stdout
    name: bdd_llama1B_select_closest_to_init
    tags:
      - nano
      - bdd
      - llama_1
      - channel_selection
