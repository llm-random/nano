# Baselines for llama_1B_closest_to_init_keep70: retraining Llama-3.2-1B after structured
# FFN pruning to 70% of the channels (5736 of 8192 per layer, a multiple of 8), chosen by
#   magnitude -- largest ||gate_i||^2 + ||up_i||^2 + ||down_i||^2
#   random    -- uniformly random per layer, seed 0
# (configs/bdd/llama_1B_select_baselines_keep70.yaml, lem job 6262309).
#
# Pipeline: HF weights -> prune_from_selection (dmodel untouched) -> train as
# llama_1B_retrain (FineWeb-Edu, 2000 steps x 524,288 tokens, 4x H100).
#
# Grid: method x learning_rate = 2 x 3 = 6 runs; learning_rate n means 2**-n:
#   15 -> 3.05e-5, 16 -> 1.53e-5, 17 -> 7.63e-6
#
#   python run_exp.py --config-path configs/bdd --config-name llama_1B_baselines_keep70
defaults:
  - llama_1B_retrain
  - _self_


common:
  ^method:
    - magnitude
    - random
  # Placeholder for run_exp.py, which resolves the config before expanding the grid;
  # every grid point overwrites it with its ^method value.
  method: magnitude


trainer:
  ^learning_rate:
    - 15
    - 16
    - 17

  checkpoint:
    save:
      path: "/lustre/pd03/plgrid/plgllmefficont3/nano/${oc.env:USER}/checkpoints/bdd/llama_1B_${common.method}_keep70"


apply_functions:
  - _target_: src.projected_compression.pruning.prune_from_selection
    _partial_: true
    selection_path: "/lustre/pd03/plgrid/plgllmefficont3/nano/${oc.env:USER}/channel_selection/llama_1B/${common.method}_keep70.json"


infrastructure:
  slurm:
    job-name: bdd_base70
  metric_logger:
    # Fixed: run_exp.py reads this before the grid is expanded. The tags tell runs apart.
    name: bdd_llama1B_baselines_keep70
    tags:
      - nano
      - bdd
      - llama_1
      - ffn_prune
      - keep70
      - lr_sweep
      - ${common.method}
