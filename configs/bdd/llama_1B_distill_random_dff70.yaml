# Distillation into a randomly initialized Llama-3.2-1B-shaped student with 70% of the FFN
# width, teacher = full meta-llama/Llama-3.2-1B (HF weights, frozen).
#
# Student: llama_3_1 architecture, dff = 0.7 * 8192 rounded to a multiple of 8 = 5736
# (the same rounding as channel_selectors.kept_channel_count); everything else as Llama-1B.
# No weights are loaded (checkpoint.load.type nano with path null -> random init).
# Budget as llama_1B_retrain: 2000 steps x 512 x 1024 = ~1.05B tokens.
#
# LR grid 15/16/17 (learning_rate n means 2**-n): 3.05e-5, 1.53e-5, 7.63e-6.
#
#   python run_exp.py --config-path configs/bdd --config-name llama_1B_distill_random_dff70
defaults:
  - ../_cluster@_here_: lem_user
  - ../_model@_here_: llama_3_1
  - ../_trainer@_here_: llama3_1B_distillation
  - ../_dataset@_here_: fineweb
  - ../_checkpoints@_here_: none
  - ../_misc@_here_: default
  - _self_


common:
  sequence_length: 1024
  # 512 x 1024 = 524,288 tokens per step.
  batch_size: 512
  keep_pct: 70
  dff: ${eval:'round(${common.keep_pct} / 100 * 8192 / 8) * 8'}


trainer:
  n_steps: 2000
  ^learning_rate:
    - 15
    - 16
    - 17
  # Per-GPU micro-batch = 512 / (4 GPUs x 8) = 16 sequences, as llama_1B_retrain.
  gradient_accumulation_steps: 8

  checkpoint:
    load:
      type: nano
      path: null
    save:
      type: nano
      interval: 500
      path: "/lustre/pd03/plgrid/plgllmefficont3/nano/${oc.env:USER}/checkpoints/bdd/llama_1B_distill_random_dff70"


infrastructure:
  slurm:
    job-name: bdd_distill_rnd70
    time: "1-00:00:00"
  metric_logger:
    name: bdd_llama1B_distill_random_dff70
    tags:
      - nano
      - bdd
      - llama_1
      - distillation
      - random_init
      - dff70
