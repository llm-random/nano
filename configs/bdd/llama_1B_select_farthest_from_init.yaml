# The opposite of llama_1B_select_closest_to_init: keep the FFN channels whose remaining
# gate / up / down weights are FARTHEST (mean W1 / sigma) from the huggingface init
# N(0, 0.02) (channel_selectors.select_farthest_from_init). Same grid (keep 30..90%,
# kept dff rounded to the nearest multiple of 8) and search settings.
#
#   python run_exp.py --config-path configs/bdd --config-name llama_1B_select_farthest_from_init
#
# Output: /lustre/pd03/plgrid/plgllmefficont3/nano/$USER/channel_selection/llama_1B/
#         farthest_from_init_huggingface_keep{30..90}.json
defaults:
  - llama_1B_select_closest_to_init
  - _self_


channel_selection:
  selector:
    _target_: src.projected_compression.channel_selectors.select_farthest_from_init
  notes: "configs/bdd/llama_1B_select_farthest_from_init.yaml"
  save_name: "farthest_from_init_${common.reference}_keep${common.keep_pct}"


infrastructure:
  slurm:
    job-name: bdd_select_far
  metric_logger:
    name: bdd_llama1B_select_farthest_from_init
