  metric_logger:
    name: bdd_llama1B_distill_farthest_from_init_keep70_zephon_entropy
    tags:
      - nano
      - bdd
      - llama_1
      - ffn_prune
      - distillation
      - farthest_from_init
      - keep70
      - zephon
      - entropy
