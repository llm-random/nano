#   python run_exp.py --config-path configs/bdd --config-name llama_1B_distill_farthest_from_init_keep70_zephon_entropy
defaults:
  - ../_cluster@_here_: entropy_zephon_user
  - llama_1B_distill_pruned_zephon
  - _self_


common:
