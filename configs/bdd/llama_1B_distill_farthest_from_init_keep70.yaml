# llama_1B_farthest_from_init_keep70 (lr 16) and ..._lr15 with distillation from the
# full Llama-3.2-1B (llama_1B_distill_pruned). lr 15, 16.
#
#   python run_exp.py --config-path configs/bdd --config-name llama_1B_distill_farthest_from_init_keep70
defaults:
  - llama_1B_distill_pruned
  - _self_


common:
  selection: farthest_from_init_huggingface_keep70


trainer:
  ^learning_rate:
    - 15
    - 16


infrastructure:
  slurm:
    job-name: bdd_d_far70
  metric_logger:
    name: bdd_llama1B_distill_farthest_from_init_keep70
    tags:
      - nano
      - bdd
      - llama_1
      - ffn_prune
      - distillation
      - farthest_from_init
      - keep70
