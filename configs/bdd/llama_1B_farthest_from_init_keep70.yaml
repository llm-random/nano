# llama_1B_closest_to_init_keep70 with the channels FARTHEST from the huggingface init
# (configs/bdd/llama_1B_select_farthest_from_init.yaml): 5736 of 8192 FFN channels per
# layer. Same training; a single learning rate, 16 (2**-16 = 1.53e-5).
#
#   python run_exp.py --config-path configs/bdd --config-name llama_1B_farthest_from_init_keep70
defaults:
  - llama_1B_closest_to_init_keep70
  - _self_


trainer:
  ^learning_rate:
    - 16

  checkpoint:
    save:
      path: "/lustre/pd03/plgrid/plgllmefficont3/nano/${oc.env:USER}/checkpoints/bdd/llama_1B_farthest_from_init_keep70"


apply_functions:
  - _target_: src.projected_compression.pruning.prune_from_selection
    _partial_: true
    selection_path: "/lustre/pd03/plgrid/plgllmefficont3/nano/${oc.env:USER}/channel_selection/llama_1B/farthest_from_init_huggingface_keep70.json"


infrastructure:
  slurm:
    job-name: bdd_far70
  metric_logger:
    name: bdd_llama1B_farthest_from_init_keep70
    tags:
      - nano
      - bdd
      - llama_1
      - ffn_prune
      - farthest_from_init
      - keep70
