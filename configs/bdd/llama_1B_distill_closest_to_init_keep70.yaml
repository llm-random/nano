# llama_1B_closest_to_init_keep70 with distillation from the full Llama-3.2-1B
# (llama_1B_distill_pruned). lr 15, 16, 17.
#
#   python run_exp.py --config-path configs/bdd --config-name llama_1B_distill_closest_to_init_keep70
defaults:
  - llama_1B_distill_pruned
  - _self_


common:
  selection: closest_to_init_huggingface_keep70


trainer:
  ^learning_rate:
    - 15
    - 16
    - 17


infrastructure:
  slurm:
    job-name: bdd_d_cti70
  metric_logger:
    name: bdd_llama1B_distill_closest_to_init_keep70
    tags:
      - nano
      - bdd
      - llama_1
      - ffn_prune
      - distillation
      - closest_to_init
      - keep70
      - lr_sweep
