# Tier 2+3 at mem_parallel_size 4, instrumented -- the attribution twin.
#
# The A/B twin of h20_4gpu_mb16_mp4.yaml with profile_timers and
# kernel_profile added and nothing else changed, so its kernel categories are
# directly comparable to the Tier 1 attribution runs (jobs 32579 AME, 32601
# dense, 32623/32624 for the forward/backward split). What this one has to
# answer: where the 936.4 ms of NCCL and the 269.3 + 276.6 ms of bank parameter
# all-gather went, and what the all-to-all cost instead.
#
# The timers now carry two extra sections, bank_reduce and bank_step, so the
# hand-managed path is visible in timers_ms rather than hiding inside optim.
#
# One memory-parallel group spanning all four ranks: each rank owns a quarter of
# the columns of every Q/K bank, the memory-DP subgroups are singletons, and the
# bank gradient all-reduce disappears entirely. Per-rank bank state is 11.6 GB,
# the same as FSDP2 gives today -- but FSDP2 reaches it by all-gathering whole
# banks twice per micro-step (measured at 269.3 ms forward + 276.6 ms backward,
# plan section 3) and this does not gather parameters at all. What crosses the
# wire instead is activations: an id all-gather (~1 MB) and an all-to-all of
# 3/4 x 32768 x 1280 bf16 per bank per micro-step.
#
# Read against B1 (job 32576): 26.84% MFU/GPU, 281,748 tokens/s, 3.720 s/step,
# 60.6 GiB peak. Same global token schedule, same seed, same everything else,
# so the loss trace is directly comparable step for step -- which is the plan
# section 1.4.2 gate, and the grad-norm trace beside it is 1.4.3.
#
# Everything else is configs/ame_tests/h20_4gpu_mb16.yaml (B1/mb16) unchanged:
# 4xH100, global batch 512 x 2048, ga 8 => micro-batch 16, 30 steps, seed and
# schedule identical. The ONLY difference from the baseline twin is
# trainer.mem_parallel_size.
defaults:
  - /base_schema
  - ../_misc@_here_: default
  - ../_cluster@_here_: entropy
  - ../_model/h_balanced@_here_: h20
  - ../_trainer@_here_: llama
  - ../_dataset@_here_: fineweb
  - ../_checkpoints@_here_: none
  - _self_

common:
  sequence_length: 2048
  batch_size: 512
  attention:
    type: ame

trainer:
  n_steps: 30
  learning_rate: 0.000244140625 # 2^-12, the audit's value
  gradient_accumulation_steps: 8 # micro-batch 16 x 2048 at 4 GPUs
  eval_interval: 0
  eval_dataloader: null
  scheduler:
    warmup_steps: 10
  # The one thing that differs from the baseline twin. Must divide world_size.
  mem_parallel_size: 4
  # Measurement only. Both are pure observation of an otherwise identical run.
  profile_timers: true
  kernel_profile: true

# Top-level, not a trainer key: main.py reads it off the config root
# (`cfg.get("compile_blocks_full")`), so on the CLI it keeps its `+`.
compile_blocks_full: true

infrastructure:
  slurm:
    gres: gpu:h100:4
    job-name: ame_mp4_attrib
    time: "0-01:00:00"
  metric_logger:
    project_name: nano-ame
    name: ame_h20_4gpu_mb16_mp4_attrib
    tags:
      - ame
      - h20
      - multigpu
      - tier2
      - tier3
      - mp4
      - o31
