# Tier 2+3 at mem_parallel_size 2 -- the middle of the sweep.
#
# Two memory-parallel groups of 2 ranks, each rank owning half the columns of
# every bank, and memory-DP subgroups of 2 -- so unlike mp=4 the bank
# all-reduce does NOT disappear, it just runs over half the world. This is the
# point that separates "sharding the banks helped" from "deleting the bank
# all-reduce helped"; at mp=1 and mp=4 those two effects are confounded.
#
# Per-rank bank state 23.2 GB against 11.6 GB sharded by FSDP2, so ~72 GiB
# peak against B1's 60.6 GiB. Expected to fit, with little room.
#
# Everything else is configs/ame_tests/h20_4gpu_mb16.yaml (B1/mb16) unchanged:
# 4xH100, global batch 512 x 2048, ga 8 => micro-batch 16, 30 steps, seed and
# schedule identical. The ONLY difference from the baseline twin is
# trainer.mem_parallel_size.
defaults:
  - /base_schema
  - ../_misc@_here_: default
  - ../_cluster@_here_: entropy
  - ../_model/h_balanced@_here_: h20
  - ../_trainer@_here_: llama
  - ../_dataset@_here_: fineweb
  - ../_checkpoints@_here_: none
  - _self_

common:
  sequence_length: 2048
  batch_size: 512
  attention:
    type: ame

trainer:
  n_steps: 30
  learning_rate: 0.000244140625 # 2^-12, the audit's value
  gradient_accumulation_steps: 8 # micro-batch 16 x 2048 at 4 GPUs
  eval_interval: 0
  eval_dataloader: null
  scheduler:
    warmup_steps: 10
  # The one thing that differs from the baseline twin. Must divide world_size.
  mem_parallel_size: 2

# Top-level, not a trainer key: main.py reads it off the config root
# (`cfg.get("compile_blocks_full")`), so on the CLI it keeps its `+`.
compile_blocks_full: true

infrastructure:
  slurm:
    gres: gpu:h100:4
    job-name: ame_mp2_4g
    time: "0-01:00:00"
  metric_logger:
    project_name: nano-ame
    name: ame_h20_4gpu_mb16_mp2
    tags:
      - ame
      - h20
      - multigpu
      - tier2
      - tier3
      - mp2
