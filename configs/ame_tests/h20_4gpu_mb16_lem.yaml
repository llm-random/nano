# LEM duplicate of the entropy run of the same name. Submitted because lem's
# queue is 3 days deep and entropy's is hours -- whichever delivers first wins,
# and the loser gets cancelled.
#
# IMPORTANT, do not cross the two clusters when reading results. lem is
# gpu:hopper:4 -- four GPUs per NODE -- against entropy's 8xH100 SXM in one
# node. O9 is a COMMUNICATION optimisation, so its measured value is a property
# of the interconnect. A lem B1 may only be compared with a lem O9, and an
# entropy B1 only with an entropy O9. Mixing them measures the fabric, not the
# change.
#
# B1/mb16 -- AME h20 on four entropy H100s at micro-batch 16.
#
# The 4-GPU baseline every Tier 1-3 result is read against
# (documents/notes/archive/ame_optimization_plan.md section 2.3). It is h20_smoke.yaml
# with the GPU count raised from 1 to 4 and gradient accumulation lowered to
# match, so the GLOBAL token schedule is byte-for-byte the schedule the 1-GPU
# baseline trained:
#
#   common.batch_size is the GLOBAL batch -- get_dataloader hands each rank
#   batch_size // world_size -- so the per-GPU micro-batch is
#
#       micro_batch = batch_size / (ngpu * gradient_accumulation_steps)
#                   = 512 / (4 * 8) = 16
#
# The 1-GPU baseline ran micro-batch 4 at ga 128; this quadruples the per-GPU
# micro-batch while the global optimizer step is unchanged. Holding the global batch
# fixed and varying only the physical split is the pkmf ablation invariant
# (archive/ame_optimization.md section 5): tokens/s and MFU stay directly comparable
# across GPU counts and micro-batches because every cell trains the identical
# 512 x 2048-token optimizer step.
#
# This variant is one of the two that test whether the micro-batch-4 bound was a
# 1-GPU artefact. At 1 GPU FSDP2 sharded nothing, so ~57 GiB of bf16 parameters,
# fp32 masters, fp32 grads and both Adam moments left only ~23 GiB of activation
# headroom -- not enough for a micro-batch of 16. At 4 GPUs all of that resident
# state is sharded four ways, to ~14 GiB/GPU. If this run OOMs, record the step
# it OOMs at and fall back to the largest micro-batch that fits: that is a
# finding, not a failure (plan section 2.3).
#
# Reference points: AME 1 GPU, ga 128, mb 4 = 47,391 tok/s / 18.1% MFU /
# 22.1 s per step (entropy job 32360). Dense GPT-2-arch h20 at 4 GPUs =
# 425,054 tok/s / 44.28% / 2.47 s (mfu_audit/h20_mgpu.yaml). AME is
# 3.77 GFLOPs/token, so MFU x 262,335 = tokens/s per GPU.
defaults:
  - /base_schema
  - ../_misc@_here_: default
  - ../_cluster@_here_: lem
  - ../_model/h_balanced@_here_: h20
  - ../_trainer@_here_: llama
  - ../_dataset@_here_: fineweb
  - ../_checkpoints@_here_: none
  - _self_

common:
  sequence_length: 2048
  batch_size: 512
  attention:
    type: ame

trainer:
  n_steps: 30
  learning_rate: 0.000244140625 # 2^-12, the audit's value
  gradient_accumulation_steps: 8 # micro-batch 16 x 2048 at 4 GPUs
  eval_interval: 0
  eval_dataloader: null
  scheduler:
    warmup_steps: 10

# Top-level, not a trainer key: main.py reads it off the config root
# (`cfg.get("compile_blocks_full")`), so on the CLI it keeps its `+`.
compile_blocks_full: true

infrastructure:
  slurm:
    gres: gpu:hopper:4
    job-name: lem_ame_mb16
    time: "0-01:00:00"
  metric_logger:
    project_name: nano-ame
    name: lem_ame_h20_4gpu_mb16
    tags:
      - ame
      - h20
      - multigpu
      - baseline_b1
