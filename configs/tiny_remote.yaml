defaults:
  - base_schema
  - _cluster@_here_: entropy
  - _model/h_balanced@_here_: h16
  - _trainer@_here_: llama
  - _dataset@_here_: fineweb
  - _checkpoints@_here_: none
  - _misc@_here_: default
  # - _eval@_here_: basic

common:
  sequence_length: 256
  batch_size: 256

trainer:
  gradient_accumulation_steps: 1
  n_steps: 40_000
  learning_rate: 1e-3

  checkpoint:
    save:
      type: nano
      path: checkpoint

infrastructure:
  max_concurrent_jobs: 1

  metric_logger:
    name: tiny_remote
    tags:
      - nano
      - remote
      - 1h_test

  slurm:
    time: "02:00:00"
    gres: gpu:4
    job-name: ${infrastructure.metric_logger.name}

