# Offline SliceGPT slicing job (1 GPU, no training) for the hybrid baseline "SliceGPT + FFN pruning", Llama-3.1-8B.
# Produces a sliced checkpoint for recovery training (configs/pc_project_mas/llama_8B_slicegpt_hyb*_entropy.yaml).
# Select the ratio with `slicegpt_ratio=r50|r70|r90` (or `^slicegpt_ratio: [r50, r70, r90]` via run_exp).
# TODO before running: copy llama8b_in_nano.pt + 8B importances from lem to entropy (not there yet).
defaults:
  - ../_cluster@_here_: entropy
  - ../_model@_here_: llama_3_8          # FULL base model
  - ../_trainer@_here_: llama            # only for the FineWeb-Edu dataset/tokenizer config
  - ../_dataset@_here_: fineweb
  - ../_checkpoints@_here_: none
  - ../_misc@_here_: default
  - _self_

init_model_opt_sched_fn:
  _target_: src.projected_compression.slicegpt.run_slicing.slice_llama_model
  _partial_: true

common:
  sequence_length: 2048   # RoPE cache length = calibration length
  batch_size: 512

# hybrid: dff = HP's dff, d chosen so total params match the HP model (slicegpt.md, "Parameter matching")
slicegpt_dims:
  r50: {d: 2744, dff: 9216}
  r70: {d: 1960, dff: 6480}
  r90: {d: 984, dff: 3168}
slicegpt_ratio: r50

slicegpt:
  target_d: ${slicegpt_dims.${slicegpt_ratio}.d}
  target_dff: ${slicegpt_dims.${slicegpt_ratio}.dff}
  orientation: random          # SliceGPT repo default; "pca" = paper description
  center_embeddings: false     # SliceGPT's LayerNorm-only step; true only for the reference cross-check
  seed: 0
  dimensions_importances_path: /storage_nvme_4/nano/j321m/pc/importances/8b/minitron_dimensions_importances.pt
  source:
    type: nano                 # nano | huggingface (meta-llama/Llama-3.1-8B)
    path: /storage_nvme_4/nano/j321m/pc/llama8b_in_nano.pt
  # 1024 x 2048 x 4096 fp32 = 34 GB per signal list, ~3 lists held in CPU RAM (h100a has 1 TB)
  calibration:
    n_samples: 1024
    sequence_length: 2048
    batch_size: 8
    seed: 42                   # != training seed 123
  eval:
    n_samples: 64
    sequence_length: 2048      # 8B HP trains with sequence_length 2048
    batch_size: 4
    seed: 7
    fused_model: true
  save_path: /storage_nvme_4/nano/j321m/pc/slicegpt
  save_name: llama8b_slicegpt_hyb_${slicegpt_ratio}

trainer:
  distributed: null
  n_steps: 1   # unused (no training); keeps the trainer's warmup interpolation resolvable

infrastructure:
  server: entropy_j
  metric_logger:
    name: llama8_slicegpt_hyb_slice_${slicegpt_ratio}
    new_wandb_job: true
    wandb_entity: ideas_cv
    project_name: pc_v2
    tags: [nano, llama_8, slicegpt, hybrid, slicing]
  slurm:
    job-name: ${infrastructure.metric_logger.name}
    partition: h100
    gres: "gpu:h100:1"
    time: "0-12:00:00"
