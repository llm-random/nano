# Minimal evaluator config for smoke-testing run_decay.py --eval_config.
# Uses limit=1 so it runs in seconds on a tiny model.
downstream_evaluator:
  _partial_: true
  _target_: src.core.eval.Evaluator
  tokenizer: ${common.tokenizer}
  tasks:
    - piqa
  limit: 1
  max_length: ${common.sequence_length}
  max_gen_toks: 32
  batch_size: 1
  eval_interval: ???
  final_eval: false
