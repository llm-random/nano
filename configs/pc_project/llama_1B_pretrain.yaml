defaults:
  - ../_cluster@_here_: entropy
  - ../_model@_here_: llama_3_1
  - ../_trainer@_here_: llama
  - ../_dataset@_here_: fineweb
  - ../_checkpoints@_here_: none
  - ../_misc@_here_: default


common:
  # Required by _dataset/default.yaml (total_batch_size: ${common.batch_size}); no
  # _model or _trainer config supplies a default, so each experiment must set it.
  batch_size: 512


trainer:
  n_steps: 2000
  learning_rate: 0.00005
  gradient_accumulation_steps: 4


infrastructure:
  metric_logger:
    name: test
    tags:
      - pc
      - nano
      - llama_1
      - test_configs
      - pretrain_llama