  - arc_challenge
  - hellaswag
  - piqa
  - winogrande
  - openbookqa
  - sciq
  - social_iqa
  - lambada_openai

limit: null  # set to e.g. 100 for quick test
output_dir: null  # null = save results next to each model checkpoint
batch_size: 4
num_fewshot: 0

device: cuda

