defaults:
  - ../_cluster@_here_: entropy
  - ../_model/smollm@_here_: def_1700
  - ../_trainer@_here_: llama
  - ../_dataset@_here_: smollm_corpus
  - ../_checkpoints@_here_: none
  - ../_misc@_here_: default
  - _self_


common:
  sequence_length: 1024
  batch_size: 4


trainer:
  gradient_accumulation_steps: 8 # not used
  n_steps: 0 # not used
  learning_rate: 1 # not used

  checkpoint:
   load:
    type: huggingface
    path: "HuggingFaceTB/SmolLM-1.7B"
   save:
    type: nano
    path: /storage_nvme_3/mstefaniak/pc/importances_smoll
    interval: ${eval:'${trainer.n_steps} - 1'}
    model_checkpoint_filename: __model_checkpoint_filename.pt
    training_state_filename: __training_state_filename.pt

  train_dataloader:
    tokenize_fn: 
      _target_: src.core.datasets.get_tokenize_fn
      model_name: HuggingFaceTB/SmolLM-1.7B

  eval_dataloader:
    tokenize_fn: 
      _target_: src.core.datasets.get_tokenize_fn
      model_name: HuggingFaceTB/SmolLM-1.7B


infrastructure:
  metric_logger:
    name: SmolLM_1700_importances
    tags:
      - nano
      - pc
      - smollm_1700
      - IMPORTANCES
      - smollm_corpus

  slurm:
    job-name: importances_smollm_1700
    gres: gpu:1
    nodes: 1
    time: "0-2:00:00"


apply_functions:
  - _target_: src.projected_compression.weight_importances.dummy_importances
    _partial_: true
    dmodel: ${common.dmodel}
    dff: ${common.dff}
    n_blocks: ${model.encoder.n_blocks}
    checkpoint_save_path: ${trainer.checkpoint.save.path}
  - _target_: src.projected_compression.weight_importances.minitron_importances
    _partial_: true
    dataloader: ${trainer.train_dataloader}
    dmodel: ${common.dmodel}
    dff: ${common.dff}
    calibration_dataset_size: 8192
    seq_len: ${common.sequence_length}
    total_batch_size: ${trainer.train_dataloader.total_batch_size}
    n_blocks: ${model.encoder.n_blocks}
    checkpoint_save_path: ${trainer.checkpoint.save.path}
  - _target_: src.projected_compression.weight_importances.magnitude_importances
    _partial_: true
    dmodel: ${common.dmodel}
    dff: ${common.dff}
    n_blocks: ${model.encoder.n_blocks}
    checkpoint_save_path: ${trainer.checkpoint.save.path}
