defaults:
  - ../../_cluster@_here_: entropy
  - ../../_model/smollm@_here_: def_1700
  - ../../_trainer@_here_: llama
  - ../../_dataset@_here_: smollm_corpus
  - ../../_checkpoints@_here_: none
  - ../../_misc@_here_: default
  - _self_

common:
  sequence_length: 1024
  batch_size: 512
  target_dmodel: 960
  target_dff: 3840

trainer:
  gradient_accumulation_steps: 8
  ^n_steps:
    # - 2048 # 1B tokens
    - 4096 # 2B tokens
    # - 8192 # 4B tokens
    # - 12288 # 6B tokens

  ^learning_rate:
    - 11
    - 12
    - 13
    - 14

  scheduler:
    warmup_steps: 40

  checkpoint:
    load:
      type: huggingface
      path: "HuggingFaceTB/SmolLM-1.7B"
    save:
      type: nano
      path: /storage_nvme_1/md/checkpoints
      interval: ${eval:'${trainer.n_steps} - 1'}
      model_checkpoint_filename: __model_checkpoint_filename.pt
      training_state_filename: __training_state_filename.pt

  train_dataloader:
    tokenize_fn:
      _target_: src.core.datasets.get_tokenize_fn
      model_name: HuggingFaceTB/SmolLM-1.7B

  eval_dataloader:
    tokenize_fn:
      _target_: src.core.datasets.get_tokenize_fn
      model_name: HuggingFaceTB/SmolLM-1.7B

infrastructure:
  metric_logger:
    name: SLLM_1700_prune_70_lr_grid
    tags:
      - nano
      - pc
      - smollm_1700
      - hard_pruning
      - no_distillation
      - 70p
      - 2B_tokens
      - lr_grid
  slurm:
    job-name: ${infrastructure.metric_logger.name}
    gres: gpu:4
    time: "0-24:00:00"

apply_functions:
  - _target_: src.projected_compression.pruning.prune
    _partial_: true
    dimensions_importances_path: /home/m1kush/llmrandom_cemetery/SmolLM_1700_importances_2026-03-28_15-44-28/None/144636/0/minitron_dimensions_importances.pt # CHANGE
    target_dmodel: ${common.target_dmodel}
    target_dff: ${common.target_dff}
