defaults:
  - ../../_cluster@_here_: entropy
  - ../../_model/smollm@_here_: projected_1700
  - ../../_trainer@_here_: smollm_1700_distillation
  - ../../_dataset@_here_: smollm_corpus
  - ../../_checkpoints@_here_: none
  - ../../_misc@_here_: default
  - _self_

common:
  sequence_length: 1024
  batch_size: 512
  dmodel: 1344
  dff: 5376

trainer:
  gradient_accumulation_steps: 8
  ^n_steps:
    # - 2048 # 1B tokens
    - 4096 # 2B tokens
    # - 8192 # 4B tokens
    # - 12288 # 6B tokens

  ^learning_rate:
    - 11
    - 12
    - 13
    - 14
    - 15

  scheduler:
    warmup_steps: 40

  checkpoint:
    load:
      type: huggingface
      path: "HuggingFaceTB/SmolLM-1.7B"
    save:
      type: nano
      path: /storage_nvme_1/md/checkpoints
      interval: ${eval:'${trainer.n_steps} - 1'}
      model_checkpoint_filename: __model_checkpoint_filename.pt
      training_state_filename: __training_state_filename.pt

  eval_interval: 1000000
  eval_dataloader: None
  train_dataloader:
    seed: 1000
    tokenize_fn:
      _target_: src.core.datasets.get_tokenize_fn
      model_name: HuggingFaceTB/SmolLM-1.7B

infrastructure:
  metric_logger:
    name: SLLM_1700_comp_distill_50_lr_grid
    tags:
      - nano
      - pc
      - smollm_1700
      - projected_compression
      - distillation
      - 50p
      - 2B_tokens
      - lr_grid
  slurm:
    job-name: ${infrastructure.metric_logger.name}
    gres: gpu:4
    time: "0-24:00:00"

apply_functions:
  - _target_: src.projected_compression.compression.init_compression
    _partial_: true
    dimensions_importances_path: /home/m1kush/llmrandom_cemetery/SmolLM_1700_importances_2026-03-28_15-44-28/None/144636/0/minitron_dimensions_importances.pt # CHANGE
    target_dmodel: ${common.dmodel}
    target_dff: ${common.dff}
