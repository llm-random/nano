defaults:
  - ../_cluster@_here_: lem
  - ../_model/qwen@_here_: 1.7B
  - ../_trainer@_here_: qwen_1.7B_distillation
  - ../_dataset@_here_: fineweb
  - ../_checkpoints@_here_: none
  - ../_misc@_here_: default


common:
  sequence_length: 1024
  batch_size: 512

  # base: dmodel 2048, dff 6144
  target_dmodel: 1024 # 50
  target_dff: 3072


trainer:
  gradient_accumulation_steps: 8
  ^n_steps:
    - 2048
    - 4096
    - 8192
    - 12288

  learning_rate: 12

  scheduler:
    warmup_steps: 40

  checkpoint:
    load:
      type: huggingface_qwen
      path: "Qwen/Qwen3-1.7B-Base"
    save:
      type: nano
      path: null # CHANGE

  eval_interval: 1000000
  eval_dataloader: None
  train_dataloader:
    dataset:
      seed: 1000


infrastructure:
  metric_logger:
    name: Queen_HP
    tags:
      - nano
      - pc
      - qwen
      - 1.7B
      - hard_pruning
      - distillation
      - 50p

  slurm:
    job-name: ${infrastructure.metric_logger.name}
    gres: gpu:hopper:4
    time: "1-00:00:00"


apply_functions:
  - _target_: src.projected_compression.pruning.prune
    _partial_: true
    dimensions_importances_path: /lustre/pd03/plgrid/plgllmefficont3/plgj321m/pc/importances/qwen/1_7B/5403539/0/minitron_dimensions_importances.pt # CHANGE
    target_dmodel: ${common.target_dmodel}
    target_dff: ${common.target_dff}
