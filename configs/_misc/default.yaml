
infrastructure:
  metric_logger:
    heavy_metrics_calculation_interval: 100
    new_wandb_job: true
    name: default
    type: wandb
    wandb_entity: ideas_cv
    project_name: llm-random-test
    tags:
      - new_wandb_job

  git:
    remote_name: cemetery
    remote_url: git@github.com:llm-random/llm-random-cemetery.git

  generated_configs_path: generated_configs

  # A cluster config can redirect this by setting infrastructure.cluster_cemetery_dir.
  # It cannot just set cemetery_experiments_dir: _misc is listed AFTER _cluster in every
  # config's defaults list, so a plain value in _cluster/*.yaml is clobbered by this one.
  cemetery_experiments_dir: "${oc.select:infrastructure.cluster_cemetery_dir,'~/llmrandom_cemetery'}"

trainer:
  checkpoint:
    save:
      type: nano
      interval: -1
      path: null
      model_checkpoint_filename: __model_checkpoint_filename.pt
      training_state_filename: __training_state_filename.pt

    load:
      type: nano
      path: null
      model_checkpoint_filename: __model_checkpoint_filename.pt
      training_state_filename: null # not tested
      only_weights: true # false not tested

evaluator: null